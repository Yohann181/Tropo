<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151d29">
<title>Tropo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tropo">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Poste de préparation des vols : rail à gauche, tiroir de panneaux, carte, altimètre à droite, frise temporelle en bas (thème cockpit sombre unique) */
:root{
  --bg:#151d29; --rail:#1a2332; --panel:#1f2a3a; --row:#243246; --row-h:#2a3a51; --line:#2f3e54;
  --sel:#1e4f86; --fg:#e8eef6; --muted:#8fa0b8; --accent:#3b8cf5;
  --vfr:#2ecc71; --mvfr:#3b8cf5; --ifr:#ef4444; --lifr:#d946ef; --warn:#f5b83b;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --railw:72px; --drawerw:370px; --footh:96px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#rail{position:fixed;left:0;top:0;bottom:0;width:var(--railw);background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;padding-top:env(safe-area-inset-top,0px);z-index:1200}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11px}
.rbtn svg{width:24px;height:24px}
.rbtn:hover{color:var(--fg)}
.rbtn[aria-pressed="true"]{color:var(--accent)}
#rail .spacer{flex:1}
.brand{display:grid;justify-items:center;gap:2px;padding:12px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand span{font:800 11px var(--ui);letter-spacing:.16em;color:var(--fg)}

#stage{position:fixed;left:var(--railw);top:0;right:0;bottom:var(--footh)}
body.drawer-open #stage{left:calc(var(--railw) + var(--drawerw))}
#map{position:absolute;inset:0;background:#0e141d}
#particles{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:401}

#toolbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:1100;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#toolbar > *{pointer-events:auto}
.tb{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;color:var(--fg)}
.tb svg{width:16px;height:16px}
.tb[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
.tb.ad{font-family:var(--mono);font-size:12px}
#readout{margin-left:auto;font:12px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#readout b{color:var(--fg);font-weight:600}

/* Altimètre */
#alt{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 8px 10px;display:grid;justify-items:center;gap:6px;width:78px}
#alt .k{font:700 10px var(--ui);letter-spacing:.08em;color:var(--muted)}
#altVal{font:700 13px var(--mono);color:var(--fg);text-align:center;line-height:1.15}
#altVal small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.altbody{position:relative;height:230px;width:62px}
#altR{writing-mode:vertical-lr;direction:rtl;height:230px;width:22px;margin:0;position:absolute;left:4px;top:0;accent-color:var(--accent)}
.altticks{position:absolute;left:30px;top:0;bottom:0;width:34px;font:9.5px var(--mono);color:var(--muted)}
.altticks button{position:absolute;left:0;transform:translateY(50%);background:none;border:0;padding:0 2px;cursor:pointer;color:var(--muted);font:9.5px var(--mono)}
.altticks button:hover{color:var(--fg)}

#drawer{position:fixed;left:var(--railw);top:0;bottom:var(--footh);width:var(--drawerw);background:var(--panel);border-right:1px solid var(--line);
  z-index:1150;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer > header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#drawer h2{margin:0;font-size:15px;font-weight:700}
.x{background:var(--row);border:0;border-radius:50%;width:28px;height:28px;cursor:pointer;display:grid;place-items:center}
#dBody{overflow:auto;flex:1;min-height:0}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;background:var(--rail)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:var(--panel);text-align:left;cursor:pointer;text-decoration:none;color:var(--fg)}
.row:hover{background:var(--row-h)}
.row[aria-pressed="true"],.row[aria-checked="true"]{background:var(--sel)}
.row .ic{width:32px;height:32px;border-radius:6px;background:var(--row);display:grid;place-items:center;flex:none}
.row .ic svg{width:20px;height:20px}
.row .t{font-weight:600;flex:1;min-width:0}
.row .s{font-size:11px;color:var(--muted);font-weight:400}
.sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:left .15s}
.row[aria-pressed="true"] .sw{background:var(--accent)}
.row[aria-pressed="true"] .sw::after{left:17px}
.ctrl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ctrl label{color:var(--muted);font-size:12px;min-width:84px}
.ctrl input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font:600 11px var(--mono);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{padding:10px 14px;color:var(--muted);font-size:12px;line-height:1.5}
input.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);font:13px var(--ui)}
.field{padding:10px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.field label{font-size:12px;color:var(--muted)}
.key-miss{color:var(--warn);font-size:11px}

.pt-head{padding:12px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.pt-coord{font:600 14px var(--mono)}
.pt-sub{color:var(--muted);font-size:12px}
.pt-sub b{color:var(--fg)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-decoration:none;background:var(--row);border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--fg);width:max-content}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tile{background:var(--panel);padding:9px 12px;min-width:0}
.tile .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:600 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:11px;color:var(--muted);font-weight:400}
.tile .h{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metar{margin:10px 14px;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-word}
.cat{display:inline-block;padding:1px 7px;border-radius:4px;font:700 11px var(--mono);color:#fff;margin-right:6px}
.cat.VFR{background:var(--vfr)}.cat.MVFR{background:var(--mvfr)}.cat.IFR{background:var(--ifr)}.cat.LIFR{background:var(--lifr)}.cat.UNK{background:#5b6b82}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font:700 12px var(--mono);color:#0d1418}
.pill.ok{background:var(--vfr)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--ifr)}
.xw{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:10px 14px;align-items:center;font:12px var(--mono);border-bottom:1px solid var(--line)}
.xw input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--fg);font:12px var(--mono)}
.scroll{overflow-x:auto}
table.dt{border-collapse:collapse;font:11.5px var(--mono);font-variant-numeric:tabular-nums;width:100%}
table.dt th,table.dt td{padding:4px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.dt th{color:var(--muted);font-weight:600;background:var(--panel)}
table.dt td:first-child,table.dt th:first-child{text-align:left}
table.dt tr.cur td{background:var(--sel)}
.flag{color:#67e8f9}
#profile{display:block;width:100%;height:auto;padding:6px 8px}

/* Marqueurs aérodromes */
.apt{position:relative;width:12px;height:12px}
.apt i{position:absolute;inset:2px;border-radius:50%;border:2px solid currentColor;background:#0e141d;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.apt b{position:absolute;left:14px;top:-3px;font:600 10.5px var(--mono);color:#e8eef6;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;display:none}
.apt b span{color:#8fa0b8;font-weight:400}
.zl .apt b{display:block}
.apt.VFR{color:var(--vfr)}.apt.MVFR{color:var(--mvfr)}.apt.IFR{color:var(--ifr)}.apt.LIFR{color:var(--lifr)}.apt.UNK{color:#7b8aa0}

#foot{position:fixed;left:var(--railw);right:0;bottom:0;height:var(--footh);background:var(--rail);border-top:1px solid var(--line);z-index:1200;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
#legendRow{display:flex;align-items:center;gap:10px;min-width:0}
#legName{font-weight:700;font-size:12px;white-space:nowrap}
#legBar{flex:1;height:8px;border-radius:4px;min-width:60px}
#legLab{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--muted)}
#legWrap{flex:1;display:grid;gap:2px;min-width:0}
#status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
#tl{display:flex;align-items:center;gap:8px;min-width:0}
.tbtn{background:var(--row);border:1px solid var(--line);border-radius:6px;height:28px;min-width:30px;padding:0 8px;cursor:pointer;font:700 11px var(--mono)}
.tbtn svg{width:14px;height:14px;vertical-align:middle}
#trackWrap{flex:1;position:relative;min-width:0;height:34px}
#slider{position:absolute;left:0;right:0;top:0;width:100%;margin:0;accent-color:var(--accent)}
#ticks{position:absolute;left:8px;right:8px;top:20px;height:12px;font:10px var(--mono);color:var(--muted)}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#ticks span.now{color:var(--ifr);font-weight:700}
#tLabel{font:600 12px var(--mono);white-space:nowrap;min-width:200px;text-align:right}
#tLabel .k{display:block;font-size:10px;color:var(--muted);font-weight:400}

.leaflet-container{background:#0e141d;font-family:var(--ui)}
.leaflet-control-attribution{background:rgba(21,29,41,.8)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-tooltip{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:11.5px/1.45 var(--mono);max-width:360px;white-space:normal}
.leaflet-div-icon{background:none;border:0}

/* Widgets sur la carte */
#widgets{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));z-index:1090;display:flex;flex-direction:column;gap:8px;width:224px;pointer-events:none;max-height:calc(100% - 300px);overflow:hidden}
#widgets.left{left:10px} #widgets.right{right:100px}
.wg{pointer-events:auto;background:rgba(31,42,58,.93);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
.wk{font:700 10px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.wk > span:first-child{white-space:nowrap}
.wk .wn{text-transform:none;letter-spacing:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
#widgets{overflow-y:auto;scrollbar-width:thin}
.wrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.wbig{font:600 22px var(--mono);line-height:1.1}
.wbig small{font-size:12px;color:var(--muted);font-weight:400}
.wmini{font:11.5px/1.5 var(--mono);color:var(--muted);min-width:0}
.wmini b{color:var(--fg);font-weight:600}
/* Prévisions 5 jours (façon Météo d'Apple) */
#fc5{position:absolute;left:10px;bottom:12px;z-index:1090;width:310px;max-width:calc(100% - 110px)}
#fc5 .wk button{background:none;border:0;color:var(--muted);cursor:pointer;font:600 14px var(--ui);padding:0 2px}
.d5{display:grid;grid-template-columns:44px 30px 36px minmax(40px,1fr) 36px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(47,62,84,.8);font:600 13px var(--ui)}
.d5:first-of-type{border-top:0}
.d5 .ico{display:grid;justify-items:center;line-height:1}
.d5 .pp{font-size:9.5px;color:#7fc3ff;font-weight:700;margin-top:1px}
.d5 .lo{color:var(--muted);text-align:right;font-family:var(--mono)}
.d5 .hi{font-family:var(--mono)}
.d5 .bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.09)}
.d5 .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.d5 .bar b{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;border:1.5px solid #1f2a3a}
.pt-fc5{padding:4px 14px 8px;border-bottom:1px solid var(--line)}
/* Favoris */
.fav{position:relative;display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:12px 14px;margin:8px 10px;border-radius:14px;background:linear-gradient(135deg,#2f5f96,#1d3557);cursor:pointer;border:0;color:#fff}
.fav.night{background:linear-gradient(135deg,#232f52,#141b30)}
.fav:focus-visible{outline:2px solid var(--accent)}
.fn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{font:300 36px var(--ui);text-align:right;line-height:1;grid-row:span 2}
.fs{font-size:12px;color:#d3def0;display:flex;align-items:center;gap:5px}
.fh{font-size:12px;color:#d3def0;text-align:right}
.favx{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.25);border:0;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;color:#fff;opacity:0}
.fav:hover .favx,.fav:focus-within .favx{opacity:1}
.favform{display:flex;gap:6px}
.favform input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg);font:12px var(--ui)}

@media (max-width:760px){
  :root{--railw:0px;--drawerw:100%;--footh:124px}
  #widgets{width:176px;top:54px} #widgets.right{right:80px}
  .wbig{font-size:18px}
  #fc5{bottom:8px;width:auto;right:80px}
  body.drawer-open #fc5,body.drawer-open #widgets{display:none}
  .favx{opacity:1}
  #rail{top:auto;bottom:var(--footh);left:0;right:0;width:auto;height:56px;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding-top:0}
  #rail .spacer,.brand{display:none}
  .rbtn{flex:1;padding:6px 2px}
  #stage,body.drawer-open #stage{left:0;bottom:calc(var(--footh) + 56px)}
  #drawer{left:0;right:0;width:auto;top:auto;bottom:calc(var(--footh) + 56px);height:60%;border-right:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0}
  #toolbar .hide-m{display:none}
  #readout{display:none}
  #tl{flex-wrap:wrap;row-gap:4px}
  #tLabel{order:-1;width:100%;text-align:left;min-width:0;font-size:11px}
  #tLabel .k{display:inline;margin-right:6px}
  #ticks{display:none}
  #trackWrap{height:28px}
  #status{display:none}
  #alt{width:64px;right:8px;top:auto;bottom:12px;transform:none}
  .altbody,#altR{height:150px}
  body.drawer-open #alt{display:none}
}
@media (prefers-reduced-motion:reduce){#particles{display:none}}
</style>
</head>
<body>

<nav id="rail" aria-label="Navigation">
  <div class="brand"><img src="icon-192.png" alt="" onerror="this.remove()"><span>TROPO</span></div>
  <button class="rbtn" data-panel="search" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Recherche</button>
  <button class="rbtn" data-panel="favs" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>Favoris</button>
  <button class="rbtn" data-panel="wx" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4.25 4.25 0 0 0 7 18z"/></svg>Météo</button>
  <button class="rbtn" data-panel="maps" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>Cartes</button>
  <button class="rbtn" data-panel="point" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Point</button>
  <div class="spacer"></div>
  <button class="rbtn" data-panel="settings" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Réglages</button>
</nav>

<div id="stage">
  <div id="map" aria-label="Carte météo mondiale"></div>
  <canvas id="particles"></canvas>
  <div id="toolbar">
    <button class="tb" id="tbWx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4.25 4.25 0 0 0 7 18z"/></svg><span id="tbWxName">Vent</span></button>
    <button class="tb" id="tbMaps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg><span class="hide-m">Cartes</span></button>
    <button class="tb ad" data-ad="LFBO">LFBO</button>
    <button class="tb ad hide-m" data-ad="LFCL">LFCL</button>
    <div id="readout">Survole la carte · clique pour le détail</div>
  </div>
  <div id="widgets" class="left"></div>
  <div id="fc5" class="wg" hidden></div>
  <div id="alt" aria-label="Altitude">
    <span class="k">ALTITUDE</span>
    <div id="altVal">SFC</div>
    <div class="altbody">
      <input type="range" id="altR" min="0" max="45000" step="500" value="0" aria-label="Altitude en pieds">
      <div class="altticks" id="altTicks"></div>
    </div>
  </div>
</div>

<aside id="drawer" hidden aria-label="Panneau">

// ---------- Altitude libre (interpolation entre niveaux de pression) ----------
const PL=[1000,975,950,925,900,850,800,700,600,500,400,300,250,200,150];
const pAlt=p=>145366*(1-Math.pow(p/1013.25,0.190284));            // altitude standard (ft) d'un niveau
const altP=a=>1013.25*Math.pow(1-a/145366,1/0.190284);            // niveau de pression d'une altitude
function levelSpec(){
  if(!S.alt) return null;
  const p=altP(S.alt);
  if(p>=PL[0]) return {lo:PL[0],hi:PL[0],w:0};
  if(p<=PL[PL.length-1]) return {lo:PL[PL.length-1],hi:PL[PL.length-1],w:0};
  for(let i=0;i<PL.length-1;i++) if(p<=PL[i]&&p>=PL[i+1]) return {lo:PL[i],hi:PL[i+1],w:(Math.log(PL[i])-Math.log(p))/(Math.log(PL[i])-Math.log(PL[i+1]))};
}
const altName=a=>!a?"SFC":a<6000?`${a.toLocaleString("fr-FR")} ft`:`FL${String(Math.round(a/100)).padStart(3,"0")}`;

function cmap(name,v){
  const s=CM[name]; if(v<=s[0][0]) return s[0][1]; if(v>=s[s.length-1][0]) return s[s.length-1][1];
  for(let i=1;i<s.length;i++) if(v<=s[i][0]){ const [a,ca]=s[i-1],[b,cb]=s[i],f=(v-a)/(b-a); return [0,1,2,3].map(k=>ca[k]+(cb[k]-ca[k])*f); }
}

// ---------- Carte ----------
const map=L.map("map",{zoomControl:false,worldCopyJump:true,minZoom:2,maxZoom:15,zoomSnap:.5}).setView([43.62,1.40],7);

const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
const SRC=' · <a href="https://open-meteo.com/">Open-Meteo</a> · <a href="https://www.rainviewer.com/">RainViewer</a> · METAR <a href="https://metar.vatsim.net/">VATSIM</a> · <a href="https://ourairports.com/">OurAirports</a>';
const BASES={

let baseLayer=null; const chartLayers={};
function applyBase(){ if(baseLayer) map.removeLayer(baseLayer); baseLayer=(BASES[S.base]||BASES.dark).mk().addTo(map); }
function applyCharts(){
  for(const [id,c] of Object.entries(CHARTS)){
    if(chartLayers[id]){ map.removeLayer(chartLayers[id]); delete chartLayers[id]; }
    const key=c.key?S.keys[c.key]:"x";
    if(S.charts[id]&&key){ chartLayers[id]=c.mk(key).addTo(map); chartLayers[id].setOpacity(S.chartOpacity); }
  }
}
const oaciUrl=(lat,lon,z)=>`https://cartes.gouv.fr/explorer-les-cartes/?c=${lon.toFixed(4)}%2C${lat.toFixed(4)}&l=GEOGRAPHICALGRIDSYSTEMS.MAPS.SCAN-OACI%24GEOPORTAIL%3AOGC%3AWMTS%281%3B1%3B1%3B0%29&z=${Math.round(clamp(z,6,13))}`;

// ---------- Temps ----------
let entries=[], tIdx=0, nowIdx=0, playTimer=null;
const curT=()=>entries[tIdx]?.t ?? Date.now()/1000;
const dayFr=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
function zt(t){const d=new Date(t*1000);return `${String(d.getUTCHours()).padStart(2,"0")}${String(d.getUTCMinutes()).padStart(2,"0")}Z`;}
function lt(t){return new Date(t*1000).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
function buildEntries(){
  const keepT=entries.length?curT():null;
  const radar=rFrames.map((f,i)=>({t:f.time,kind:"radar",i}));
  const last=radar.length?radar[radar.length-1].t:Date.now()/1000;
  const h0=Math.floor(Date.now()/3600e3)*3600, fc=[];
  for(let h=1;h<=72;h++){ const t=h0+h*3600; if(t>last+600) fc.push({t,kind:"fc"}); }
  entries=[...radar,...fc];
  nowIdx=Math.max(0,radar.length-1);
  tIdx=keepT===null?nowIdx:entries.reduce((b,e,i)=>Math.abs(e.t-keepT)<Math.abs(entries[b].t-keepT)?i:b,0);
  $("slider").max=entries.length-1; $("slider").value=tIdx;
  const ticks=$("ticks"); ticks.innerHTML="";
  entries.forEach((e,i)=>{
    const d=new Date(e.t*1000); let lab=null;
    if(i===nowIdx) lab="NOW";
    else if(e.kind==="radar"&&i===0) lab="-2h";
    else if(e.kind==="fc"&&d.getUTCMinutes()===0&&d.getUTCHours()%6===0) lab=d.getUTCHours()===0?dayFr[d.getUTCDay()]:`${String(d.getUTCHours()).padStart(2,"0")}Z`;
    if(lab&&i!==nowIdx&&Math.abs(i-nowIdx)/(entries.length-1)<.04) lab=null;
    if(lab){ const s=document.createElement("span"); s.textContent=lab; if(i===nowIdx) s.className="now"; s.style.left=(i/(entries.length-1)*100)+"%"; ticks.appendChild(s); }
  });
  setTime(tIdx);
}
function setTime(i){
  tIdx=clamp(i,0,entries.length-1); $("slider").value=tIdx;
  const e=entries[tIdx]; if(!e) return;
  const rel=Math.round((e.t-Date.now()/1000)/3600), d=new Date(e.t*1000);
  const kind=e.kind==="radar"?(tIdx===nowIdx?"OBSERVATION · DERNIÈRE":"OBSERVATION RADAR"):`PRÉVISION ${rel>=0?"+":""}${rel} h`;
  $("tLabel").innerHTML=`<span class="k">${kind}</span>${dayFr[d.getDay()]} ${d.getDate()} · ${zt(e.t)} <span style="color:var(--muted)">(${lt(e.t)})</span>`;
  showRadar(); renderAll(); resetParticles(); if(P) renderPoint();
}
$("slider").oninput=e=>setTime(+e.target.value);
$("prev").onclick=()=>setTime(tIdx-1); $("next").onclick=()=>setTime(tIdx+1);
$("nowBtn").onclick=()=>setTime(nowIdx);
$("play").onclick=()=>{
  if(playTimer){clearInterval(playTimer);playTimer=null;$("play").innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';return;}
  $("play").innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  playTimer=setInterval(()=>setTime(tIdx>=entries.length-1?0:tIdx+1),800);
};

// ---------- Radar ----------
let rFrames=[], rLayers=[];
async function loadRadar(){
  try{
    const j=await (await fetch("https://api.rainviewer.com/public/weather-maps.json",{cache:"no-store"})).json();
    rLayers.forEach(l=>map.removeLayer(l));
    rFrames=j.radar?.past||[];
    rLayers=rFrames.map(f=>L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{pane:"radar",opacity:0,maxNativeZoom:7,maxZoom:18}));
    if(S.radar) rLayers.forEach(l=>l.addTo(map));
  }catch(e){ rFrames=[]; status("Radar indisponible"); }
  buildEntries();
}
function showRadar(){ const e=entries[tIdx]; rLayers.forEach((l,k)=>l.setOpacity(S.radar&&e?.kind==="radar"&&e.i===k?.8:0)); }

// ---------- Grilles modèles ----------
/* Open-Meteo compte chaque point de grille comme une requête (limites gratuites ~600/min, 5 000/h, 10 000/jour).

let GA=null, GM=null, gridTimer=null, gridSeq=0, retryTimer=null, busy=false, arrCache=new Map();
const wrapLon=x=>((x+540)%360)-180;

function groupsFor(f){

function neededGroups(){

function viewBox(pad){

  if(e-w>=300){w=-180;e=180;} else { const c=wrapLon((w+e)/2), half=(e-w)/2; w=c-half; e=c+half; }

function boxOk(ds){

function newBox(){ const b=viewBox(.5); return {s:b.s,n:b.n,w:b.w,e:b.e,k:S.grid,at:Date.now(),groups:new Set(),data:{},times:null,id:Math.random()}; }
function usage(add){ // estimation des requêtes consommées sur l'heure glissante

async function fetchGrid(kind,vars,box){

  const extra=kind==="marine"?"&past_days=1&forecast_days=3":"&past_hours=3&forecast_hours=72&wind_speed_unit=kn";
  usage(n*n);
  const r=await fetch(`${base}?latitude=${lats.join(",")}&longitude=${lons.join(",")}&hourly=${vars.join(",")}&timeformat=unixtime${extra}`);
  const j=await r.json();

}
function scheduleGrids(delay=700){ clearTimeout(gridTimer); gridTimer=setTimeout(refreshGrids,delay); }
async function refreshGrids(){

    const box=boxOk(GA)?GA:newBox();
    const missing=groups.filter(g=>!box.groups.has(g)), packs=[];

  if(FIELDS[S.field]?.marine){
    const box=boxOk(GM)?GM:newBox();
    if(!box.groups.has("marine")) jobs.push(fetchGrid("marine",["sea_surface_temperature","wave_height","wave_direction","wave_period"],box).then(d=>{ Object.assign(box.data,d.data); box.times=d.times; box.groups.add("marine"); if(seq===gridSeq) GM=box; }));

}
function tIndex(ds,t){ const ts=ds.times; let best=0; for(let i=1;i<ts.length;i++) if(Math.abs(ts[i]-t)<Math.abs(ts[best]-t)) best=i; return best; }
// tableau (Float32Array) d'une variable à l'instant ti, interpolé à l'altitude choisie si besoin
function levelArr(ds,ti,base,sfc){

// ---------- Rendu des couches colorées ----------
const overlays={};

  const size=map.getSize(), cell=isMobile()?4:3, W=Math.ceil(size.x/cell), H=Math.ceil(size.y/cell);
  const lats=new Float32Array(H), lons=new Float32Array(W);

function renderAll(){

function dropOverlay(pane){ if(overlays[pane]){ map.removeLayer(overlays[pane]); delete overlays[pane]; } }
function arrowPath(g){ g.beginPath(); g.moveTo(0,10); g.lineTo(0,-10); g.moveTo(-5,-4); g.lineTo(0,-10); g.lineTo(5,-4); }
// flèches régulières sur la carte ; fn(lat,lon) -> {ang (rad, sens de déplacement), label, col} ou null

  const g=c.getContext("2d"); g.scale(d,d); g.font="600 10px JetBrains Mono, monospace"; g.textAlign="center"; g.lineCap="round"; g.lineJoin="round";
  let any=false;

// Jet-stream : vent à 250 hPa (≈ FL340), affiché seulement au-delà de 60 kt
function renderJet(){

// Vagues : flèche dans le sens de propagation + hauteur

// Isobares (tous les 4 hPa, 2 hPa en zoom fort) + centres A / D

  const g=c.getContext("2d"); g.scale(d,d); g.font="600 11px JetBrains Mono, monospace"; g.textBaseline="middle";
  const step=isMobile()?96:118;

function updateLegend(){

  if(!f?.cmap){ $("legName").textContent=S.particles?`Particules de vent · ${altName(S.alt)}`:"Aucun champ"; $("legBar").style.background="var(--line)"; $("legLab").innerHTML=""; return; }

  const pick=[s[0][0],s[Math.floor(s.length/3)][0],s[Math.floor(2*s.length/3)][0],s[s.length-1][0]];
  $("legLab").innerHTML=pick.map(v=>`<span>${v}</span>`).join("");

// ---------- Particules ----------
const cv=$("particles"), ctx=cv.getContext("2d"); let parts=[], moving=false;
function sizeCanvas(){ const d=devicePixelRatio||1, r=cv.getBoundingClientRect(); cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); resetParticles(); }
function resetParticles(){
  const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
  const n=Math.min(2600,Math.round(r.width*r.height/(isMobile()?1400:1000)));
  parts=Array.from({length:n},()=>({x:Math.random()*r.width,y:Math.random()*r.height,age:Math.random()*80|0}));
}
const PCOL=["#7aa2f7","#4fd1c5","#a3e635","#fbbf24","#f97316","#ef4444","#d946ef"];
function frame(){
  requestAnimationFrame(frame);
  if(!S.particles||!GA?.times||moving) return;
  const r=cv.getBoundingClientRect(), ti=tIndex(GA,curT());
  const u=levelArr(GA,ti,"_u|wind_speed","_u|wind_speed_10m"), v=levelArr(GA,ti,"_v|wind_speed","_v|wind_speed_10m"); if(!u||!v) return;
  const mono=FIELDS[S.field]?.cmap;
  ctx.globalCompositeOperation="destination-in"; ctx.fillStyle="rgba(0,0,0,.9)"; ctx.fillRect(0,0,r.width,r.height);
  ctx.globalCompositeOperation="source-over"; ctx.lineWidth=1.1;
  for(const p of parts){
    const ll=map.containerPointToLatLng([p.x,p.y]);
    const a=sampleArr(GA,u,ll.lat,ll.lng), b=sampleArr(GA,v,ll.lat,ll.lng);
    if(Number.isNaN(a)||p.age++>90){ p.x=Math.random()*r.width; p.y=Math.random()*r.height; p.age=0; continue; }
    const s=Math.hypot(a,b), k=Math.min(0.07,5/(s||1)), nx=p.x+a*k, ny=p.y-b*k;
    ctx.strokeStyle=mono?"rgba(255,255,255,.75)":PCOL[Math.min(6,Math.floor(s/10))];
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(nx,ny); ctx.stroke(); p.x=nx; p.y=ny;
  }
}

const metarLayer=L.layerGroup().addTo(map);
const OA="https://davidmegginson.github.io/ourairports-data/";
let ST=null, METARS={}, stationsLoading=null;
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true; else if(c===","){row.push(f);f="";} else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";} else if(c!=="\r")f+=c;}
  if(f||row.length){row.push(f);rows.push(row);} return rows;}
async function loadMetarText(){
  const t=await (await fetch("https://metar.vatsim.net/metar.php?id=all",{cache:"no-store"})).text();
  const m={}; for(const l of t.split("\n")){ const id=l.slice(0,4); if(/^[A-Z0-9]{4}$/.test(id)) m[id]=l.trim(); }
  METARS=m;
}
async function buildStations(){
  try{ const c=JSON.parse(localStorage.getItem("rb2st")||"null"); if(c&&c.v===1&&Date.now()-c.at<30*864e5){ ST=c.st; return; } }catch(e){}
  status("Première ouverture : téléchargement de la base des aérodromes (une seule fois)…");
  const ids=new Set(Object.keys(METARS));
  const ap=parseCSV(await (await fetch(OA+"airports.csv")).text()), H=ap[0], ix=k=>H.indexOf(k), st={};
  for(const r of ap.slice(1)){ const id=r[ix("ident")]; if(!ids.has(id)||st[id]) continue;
    st[id]=[+(+r[ix("latitude_deg")]).toFixed(3),+(+r[ix("longitude_deg")]).toFixed(3),+r[ix("elevation_ft")]||0,r[ix("name")].slice(0,48),[]]; }
  const rw=parseCSV(await (await fetch(OA+"runways.csv")).text()), R=rw[0], jx=k=>R.indexOf(k);
  for(const r of rw.slice(1)){ const id=r[jx("airport_ident")]; if(!st[id]||r[jx("closed")]==="1") continue;
    const le=r[jx("le_ident")], he=r[jx("he_ident")]; if(!le||!he||/^H/.test(le)) continue;
    let h=parseFloat(r[jx("le_heading_degT")]); if(isNaN(h)){ const n=parseInt(le,10); h=isNaN(n)?null:n*10; }
    if(h!=null) st[id][4].push([le,he,Math.round(h),+r[jx("length_ft")]||0]); }
  ST=st; try{ localStorage.setItem("rb2st",JSON.stringify({v:1,at:Date.now(),st})); }catch(e){}
  status(`${Object.keys(st).length} stations METAR chargées`);
}
function fltCat(m){
  if(!m) return "UNK"; let vis=null, ceil=null;
  if(/\sCAVOK\s?/.test(m)) vis=10000;
  const v=m.match(/\s(\d{4})(?:NDV)?(?=\s)/); if(vis==null&&v) vis=+v[1];
  const sm=m.match(/\s(?:(\d+)\s)?(\d+)(?:\/(\d+))?SM\s/); if(vis==null&&sm){ let x=sm[3]?+sm[2]/+sm[3]:+sm[2]; if(sm[1]) x+=+sm[1]; vis=x*1609; }
  for(const c of m.matchAll(/\s(BKN|OVC|VV)(\d{3})/g)){ const h=+c[2]*100; if(ceil==null||h<ceil) ceil=h; }
  if(vis==null&&ceil==null) return "UNK";
  vis=vis??10000; ceil=ceil??1e6;
  if(ceil<500||vis<1600) return "LIFR"; if(ceil<1000||vis<5000) return "IFR"; if(ceil<=3000||vis<=8000) return "MVFR"; return "VFR";
}
const metarWind=m=>{ const w=m?.match(/\s(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT/); return w?`${w[1]}/${w[2]}${w[3]?"G"+w[3]:""}`:""; };
async function initMetars(){
  try{ await loadMetarText(); }catch(e){ status("METAR indisponibles (VATSIM ne répond pas)"); return; }
  if(!ST){ if(!stationsLoading) stationsLoading=buildStations().catch(()=>status("Base aérodromes indisponible")); await stationsLoading; }
  drawMetars(); if(P) renderPoint();
}
function drawMetars(){
  metarLayer.clearLayers();
  $("map").classList.toggle("zl",map.getZoom()>=8);
  if(!S.metar||!ST||map.getZoom()<5) return;
  const b=map.getBounds().pad(.05); let n=0;

    L.marker([s[0],s[1]],{pane:"obs",icon:L.divIcon({className:"",html:`<div class="apt ${cat}"><i></i><b>${id} <span>${metarWind(raw)}</span></b></div>`,iconSize:[12,12],iconAnchor:[6,6]}),bubblingMouseEvents:false,keyboard:false})
     .bindTooltip(`<b>${id}</b> <span class="cat ${cat}">${cat}</span> ${s[3]}<br>${raw}`,{direction:"top",offset:[0,-6]})

// ---------- Astronomie (soleil, lune) ----------
function sunElev(t,lat,lon){
  const d=t/86400-10957.5, g=(357.529+0.98560028*d)*RAD, q=280.459+0.98564736*d;
  const Lm=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, e=(23.439-0.00000036*d)*RAD;
  const ra=Math.atan2(Math.cos(e)*Math.sin(Lm),Math.cos(Lm)), dec=Math.asin(Math.sin(e)*Math.sin(Lm));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24, ha=(gmst*15+lon)*RAD-ra;
  return Math.asin(Math.sin(lat*RAD)*Math.sin(dec)+Math.cos(lat*RAD)*Math.cos(dec)*Math.cos(ha))/RAD;
}
function sunCross(day0,lat,lon,h){ // [montée, descente] à travers l'élévation h
  let prev=sunElev(day0,lat,lon), up=null, down=null;
  for(let m=5;m<=1440;m+=5){ const t=day0+m*60, e=sunElev(t,lat,lon);

  const tmin=Math.floor(Math.min(...prof.map(r=>r.td??r.t))/10)*10-5, tmax=Math.ceil(Math.max(...prof.map(r=>r.t))/10)*10+5;
  const zmax=Math.min(42000,Math.ceil(Math.max(...prof.map(r=>r.z))/5000)*5000);
  const X=t=>m.l+(t-tmin)/(tmax-tmin)*(W-m.l-m.r), Y=z=>Hh-m.b-z/zmax*(Hh-m.t-m.b);
  let s=`<svg id="profile" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Profil de température et point de rosée">`;
  for(let z=0;z<=zmax;z+=10000) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(z)}" y2="${Y(z)}" stroke="#2f3e54"/><text x="${m.l-4}" y="${Y(z)+3}" fill="#8fa0b8" font-size="9" text-anchor="end" font-family="JetBrains Mono,monospace">FL${String(z/100).padStart(3,"0")}</text>`;
  for(let t=Math.ceil(tmin/10)*10;t<=tmax;t+=10) s+=`<text x="${X(t)}" y="${Hh-8}" fill="#8fa0b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">${t}°</text>`;
  if(S.alt) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(S.alt)}" y2="${Y(S.alt)}" stroke="#3b8cf5" stroke-dasharray="2 3"/><text x="${m.l+3}" y="${Y(S.alt)-3}" fill="#3b8cf5" font-size="9" font-family="JetBrains Mono,monospace">${altName(S.alt)}</text>`;
  for(let k=0;k<prof.length-1;k++){ const a=prof[k],b=prof[k+1]; if(a.rh>=90&&b.rh>=90) s+=`<rect x="${m.l}" width="${W-m.l-m.r}" y="${Y(b.z)}" height="${Y(a.z)-Y(b.z)}" fill="#e8eef6" fill-opacity=".08"/>`; }
  if(tmin<0&&tmax>0) s+=`<line x1="${X(0)}" x2="${X(0)}" y1="${m.t}" y2="${Hh-m.b}" stroke="#67e8f9" stroke-dasharray="3 3" stroke-opacity=".7"/>`;
  const path=k=>prof.filter(r=>r[k]!=null).map((r,j)=>`${j?"L":"M"}${X(r[k]).toFixed(1)},${Y(r.z).toFixed(1)}`).join("");
  s+=`<path d="${path("td")}" fill="none" stroke="#3b8cf5" stroke-width="2"/><path d="${path("t")}" fill="none" stroke="#ef4444" stroke-width="2"/>`;
  for(const r of prof) if(r.t<=0&&r.t>=-15&&r.rh>=80) s+=`<circle cx="${W-m.r-4}" cy="${Y(r.z)}" r="3" fill="#67e8f9"/>`;
  s+=`<text x="${W-m.r}" y="${m.t+8}" fill="#ef4444" font-size="9.5" text-anchor="end" font-family="Inter,sans-serif">Température</text><text x="${W-m.r}" y="${m.t+20}" fill="#3b8cf5" font-size="9.5" text-anchor="end" font-family="Inter,sans-serif">Point de rosée</text>`;
  return s+"</svg>";
}

// ---------- Icônes météo (style app Météo) ----------
function wxIcon(code,day=1,s=24){
  const sun='<circle cx="12" cy="12" r="4.5" fill="#ffcf3f"/><g stroke="#ffcf3f" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>';
  const moonI='<path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z" fill="#d5ddee"/>';
  const cloud=(y,f)=>`<path transform="translate(0 ${y})" d="M7 19h10.5a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 7.4 10 4.5 4.5 0 0 0 7 19z" fill="${f}"/>`;
  const drops='<g stroke="#5fb0ff" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 19.5l-1 2.5M12.5 19.5l-1 2.5M16.5 19.5l-1 2.5"/></g>';
  const snow='<g fill="#eef3fb"><circle cx="8" cy="21" r="1.2"/><circle cx="12" cy="22.3" r="1.2"/><circle cx="16" cy="21" r="1.2"/></g>';
  const bolt='<path d="M12.6 14.5l-3 5h2.5l-1 3.5 3.8-5.5h-2.6l1.3-3z" fill="#ffcf3f"/>';
  const fog='<g stroke="#b9c4d6" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 12.5h12M4 16h16M7 19.5h10"/></g>';
  let b;
  if(code==null) b=cloud(0,"#5b6b82");
  else if(code===0) b=day?sun:moonI;
  else if(code<=2) b=`<g transform="translate(-2.5 -3.5) scale(.85)">${day?sun:moonI}</g>${cloud(1.5,"#eef3fb")}`;
  else if(code===3) b=cloud(0,"#c9d3e2");
  else if(code<=48) b=fog;
  else if(code<=67||(code>=80&&code<=82)) b=cloud(-3.5,"#c9d3e2")+drops;
  else if(code<=77||code===85||code===86) b=cloud(-3.5,"#dfe6f0")+snow;
  else b=cloud(-4,"#9aa8bd")+bolt;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${b}</svg>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CARD=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const card16=d=>d==null?"–":CARD[Math.round(((d%360)+360)%360/22.5)%16];
const beaufort=kt=>[1,4,7,11,17,22,28,34,41,48,56,64].findIndex(v=>kt<v)===-1?12:[1,4,7,11,17,22,28,34,41,48,56,64].findIndex(v=>kt<v);

// ---------- Météo des lieux (favoris, widgets, 5 jours) ----------
const WX={};
const keyOf=(lat,lon)=>lat.toFixed(2)+","+lon.toFixed(2);
async function loadWx(locs){
  const now=Date.now(), miss=locs.filter(l=>{const w=WX[keyOf(l.lat,l.lon)]; return !w||now-w.at>10*60e3;});
  if(miss.length){
    try{
      usage(miss.length);
      const ask=uv=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${miss.map(l=>l.lat.toFixed(3)).join(",")}&longitude=${miss.map(l=>l.lon.toFixed(3)).join(",")}`+
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cloud_cover${uv?",uv_index":""}`+
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset${uv?",uv_index_max":""}&forecast_days=6&timezone=auto&timeformat=unixtime&wind_speed_unit=kn`).then(r=>r.json());
      let j=await ask(true);
      if(j?.error&&!/limit/i.test(j.reason||"")) j=await ask(false);   // repli si une variable est refusée
      if(j?.error) throw new Error(j.reason); if(!Array.isArray(j)) j=[j];
      j.forEach((d,i)=>{ WX[keyOf(miss[i].lat,miss[i].lon)]={at:now,d}; });
    }catch(e){ status("Météo des lieux indisponible : "+e.message); }
  }
  return locs.map(l=>WX[keyOf(l.lat,l.lon)]?.d||null);
}
let REF=null;
const shortName=n=>String(n).replace(/\s*(International\s*)?(Airport|Aéroport|Airfield|Aerodrome|Air Base)\s*$/i,"").trim();
function refLoc(){
  if(P) return {name:P.name||(P.icao&&ST?.[P.icao]?shortName(ST[P.icao][3]):P.icao)||"Point sélectionné",lat:P.lat,lon:P.lon};
  const f=S.favs[0]; return f?{name:f.name,lat:f.lat,lon:f.lon}:{name:"Blagnac",lat:43.6293,lon:1.3638};
}
async function updateRef(){ const r=refLoc(); const [d]=await loadWx([r]); const now=refLoc(); if(now.lat!==r.lat||now.lon!==r.lon) return; REF={...r,d}; renderWidgets(); renderFc5(); }
const tCol=v=>{ const c=cmap("temp",v); return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; };
function fc5Rows(D,off,cur,n=5){
  if(!D?.time) return "";
  n=Math.min(n,D.time.length);
  const mins=D.temperature_2m_min.slice(0,n), maxs=D.temperature_2m_max.slice(0,n), lo=Math.min(...mins), hi=Math.max(...maxs), sp=(hi-lo)||1;
  return D.time.slice(0,n).map((t,k)=>{
    const a=(mins[k]-lo)/sp*100, b=(maxs[k]-lo)/sp*100, pp=D.precipitation_probability_max?.[k];
    const name=k===0?"Auj.":dayFr[new Date((t+off)*1000).getUTCDay()];
    const dot=k===0&&cur!=null?`<b style="left:${clamp((cur-lo)/sp*100,0,100)}%"></b>`:"";
    return `<div class="d5"><span>${name}</span><span class="ico">${wxIcon(D.weather_code?.[k])}${pp>=30?`<span class="pp">${pp} %</span>`:""}</span>
      <span class="lo">${Math.round(mins[k])}°</span><span class="bar"><i style="left:${a}%;right:${100-b}%;background:linear-gradient(90deg,${tCol(mins[k])},${tCol(maxs[k])})"></i>${dot}</span><span class="hi">${Math.round(maxs[k])}°</span></div>`;
  }).join("");
}
function renderFc5(){
  const el=$("fc5"), D=REF?.d?.daily; el.hidden=!S.fc5||!D; if(el.hidden) return;
  el.innerHTML=`<div class="wk"><span>Prévisions 5 jours</span><span class="wn">${esc(REF.name)}</span><button id="fc5t" aria-label="${S.fc5c?"Déplier":"Replier"}">${S.fc5c?"+":"–"}</button></div>${S.fc5c?"":fc5Rows(D,REF.d.utc_offset_seconds||0,REF.d.current?.temperature_2m)}`;
  $("fc5t").onclick=()=>{ S.fc5c=!S.fc5c; save(); renderFc5(); };
  layoutWidgets();
}
// les widgets à gauche s'arrêtent au-dessus du bandeau 5 jours (le reste défile)
function layoutWidgets(){
  const w=$("widgets"), f=$("fc5"), st=$("stage").getBoundingClientRect();
  let bottom=st.height-12;
  if(!f.hidden&&S.wpos!=="right") bottom=f.getBoundingClientRect().top-st.top-8;
  w.style.maxHeight=Math.max(120,bottom-w.offsetTop)+"px";
}

// ---------- Widgets ----------
IC.moon='<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
const WIDGETS={
 wind:{name:"Vent",sub:"mini boussole + force, rafales, Beaufort",icon:"wind"},
 temp:{name:"Température",sub:"ressenti, humidité, min / max",icon:"temp"},
 moon:{name:"Lune",sub:"phase, éclairement, prochaine pleine lune",icon:"moon"},
 sun:{name:"Soleil",sub:"lever, coucher, heure dorée",icon:"uv"},
 press:{name:"Pression & ciel",sub:"QNH, nuages, UV",icon:"qnh"},
 kp:{name:"Indice Kp",sub:"activité géomagnétique, aurores",icon:"sat"},
};
function compassSvg(dir){
  const ticks=Array.from({length:16},(_,i)=>{const a=i*22.5*RAD, r1=i%4?27:25; return `<line x1="${32+Math.sin(a)*r1}" y1="${32-Math.cos(a)*r1}" x2="${32+Math.sin(a)*29}" y2="${32-Math.cos(a)*29}" stroke="#5b6b82" stroke-width="${i%4?1:1.6}"/>`;}).join("");
  const lab=(t,x,y)=>`<text x="${x}" y="${y}" fill="${t==="N"?"#ff8a8a":"#8fa0b8"}" font-size="8" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Inter,sans-serif">${t}</text>`;
  const arrow=dir==null?"":`<g transform="rotate(${dir+180} 32 32)"><path d="M32 12 L37 24 L33.5 22.5 L33.5 46 L30.5 46 L30.5 22.5 L27 24 Z" fill="#3b8cf5" stroke="#0e141d" stroke-width=".8"/><circle cx="32" cy="48" r="3" fill="none" stroke="#3b8cf5" stroke-width="1.6"/></g>`;
  return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#151d29" stroke="#2f3e54"/>${ticks}${lab("N",32,9)}${lab("E",55,32)}${lab("S",32,55)}${lab("O",9,32)}${arrow}</svg>`;
}
function moonSvg(p,s=44){
  const r=s/2-2, k=Math.cos(2*Math.PI*p), rx=Math.abs(k)*r, wax=p<.5;
  const lit=p<.015||p>.985?"":wax?`M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${k>0?0:1} 0,${-r}Z`:`M0,${-r} A${r},${r} 0 0 0 0,${r} A${rx},${r} 0 0 ${k>0?1:0} 0,${-r}Z`;
  return `<svg width="${s}" height="${s}" viewBox="${-s/2} ${-s/2} ${s} ${s}" aria-hidden="true"><circle r="${r}" fill="#2a3346"/>${lit?`<path d="${lit}" fill="#f1ead2"/>`:""}<circle r="${r}" fill="none" stroke="#5b6b82" stroke-width=".8"/></svg>`;
}
function widgetHtml(w,d,name){
  const c=d?.current, D=d?.daily, off=d?.utc_offset_seconds||0, lt2=t=>t==null?"–":new Date((t+off)*1000).toISOString().slice(11,16);
  const head=t=>`<div class="wk"><span>${t}</span><span class="wn">${esc(name)}</span></div>`;
  if(w==="wind"){ const ws=c?.wind_speed_10m, wd=c?.wind_direction_10m, gu=c?.wind_gusts_10m;
    return `<div class="wg">${head("Vent")}<div class="wrow">${compassSvg(wd)}<div class="wmini"><div class="wbig">${n0(ws)}<small> kt</small></div>de <b>${card16(wd)}</b> (${dir3(wd)}°)<br>rafales <b>${n0(gu)}</b> kt<br>Beaufort <b>${ws==null?"–":beaufort(ws)}</b></div></div></div>`; }
  if(w==="temp") return `<div class="wg">${head("Température")}<div class="wrow">${wxIcon(c?.weather_code,c?.is_day??1,40)}<div class="wmini"><div class="wbig">${n0(c?.temperature_2m)}°</div>${WMO(c?.weather_code)}<br>ressenti <b>${n0(c?.apparent_temperature)}°</b> · HR <b>${n0(c?.relative_humidity_2m)}%</b><br>min <b>${n0(D?.temperature_2m_min?.[0])}°</b> · max <b>${n0(D?.temperature_2m_max?.[0])}°</b></div></div></div>`;
  if(w==="moon"){ const m=moon(Date.now()/1000), toFull=Math.round(((.5-m.p+1)%1)*29.53), toNew=Math.round(((1-m.p)%1)*29.53);
    return `<div class="wg">${head("Lune")}<div class="wrow">${moonSvg(m.p)}<div class="wmini"><div class="wbig">${m.ill}<small> %</small></div><b>${m.n}</b><br>${toFull<=toNew?`pleine lune dans <b>${toFull} j</b>`:`nouvelle lune dans <b>${toNew} j</b>`}</div></div></div>`; }
  if(w==="sun"){ const r=refLoc(), day0=Math.floor((Date.now()/1000+off)/86400)*86400-off, [g6u,g6d]=sunCross(day0,r.lat,r.lon,6), [g4u,g4d]=sunCross(day0,r.lat,r.lon,-4), el=sunElev(Date.now()/1000,r.lat,r.lon);
    return `<div class="wg">${head("Soleil")}<div class="wrow">${wxIcon(0,1,40)}<div class="wmini">lever <b>${lt2(D?.sunrise?.[0])}</b> · coucher <b>${lt2(D?.sunset?.[0])}</b><br>heure dorée <b>${lt2(g6d)}–${lt2(g4d)}</b><br>hauteur <b>${n0(el,0)}°</b> · UV max <b>${n0(D?.uv_index_max?.[0],1)}</b></div></div></div>`; }
  if(w==="press") return `<div class="wg">${head("Pression & ciel")}<div class="wrow"><div class="wmini"><div class="wbig">${n0(c?.pressure_msl)}<small> hPa</small></div>nuages <b>${n0(c?.cloud_cover)} %</b> · UV <b>${n0(c?.uv_index,1)}</b> (${UVL(c?.uv_index)})</div></div></div>`;
  if(w==="kp") return `<div class="wg">${head("Indice Kp")}<div class="wrow"><div class="wmini"><div class="wbig">${KP?.cur==null?"–":n0(KP.cur,1)}</div>${KPL(KP?.cur)}<br>max prévu 24 h <b>${KP?.max24==null?"–":n0(KP.max24,1)}</b></div></div></div>`;
  return "";
}
function renderWidgets(){
  const el=$("widgets"); el.className=S.wpos==="right"?"right":"left";
  const r=REF||refLoc(); el.innerHTML=S.widgets.map(w=>widgetHtml(w,REF?.d,r.name)).join("");
  layoutWidgets();
}

// ---------- Favoris ----------
function favCard(f,d,i){
  const c=d?.current, D=d?.daily, off=d?.utc_offset_seconds||0, time=d?new Date((Date.now()/1000+off)*1000).toISOString().slice(11,16):"";
  return `<div class="fav${c&&!c.is_day?" night":""}" data-fav="${i}" role="button" tabindex="0" aria-label="${esc(f.name)}">
    <div class="fn">${esc(f.name)}</div><div class="ft">${c?Math.round(c.temperature_2m)+"°":"–"}</div>
    <div class="fs">${time}${f.icao?` · ${esc(f.icao)}`:""}</div>
    <div class="fs">${c?wxIcon(c.weather_code,c.is_day,16)+WMO(c.weather_code):"Chargement…"}</div><div class="fh">${D?`H:${Math.round(D.temperature_2m_max[0])}° B:${Math.round(D.temperature_2m_min[0])}°`:""}</div>
    <div class="fs">${c?`vent ${card16(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)} kt`:""}</div>
    <button class="favx" data-del="${i}" aria-label="Retirer ${esc(f.name)}">✕</button></div>`;
}
async function renderFavs(){
  const el=$("p-favs");
  const draw=ds=>{
    el.innerHTML=(S.favs.length?S.favs.map((f,i)=>favCard(f,ds?.[i],i)).join(""):'<div class="note">Aucun favori pour l\'instant.</div>')+
      '<div class="note">Pour ajouter un lieu : clique sur la carte (ou cherche-le), puis sur « ☆ Ajouter aux favoris » dans la fiche du point. Températures mises à jour toutes les 10 minutes.</div>';
    el.querySelectorAll("[data-fav]").forEach(b=>{ const go=()=>{ const f=S.favs[+b.dataset.fav]; map.setView([f.lat,f.lon],Math.max(map.getZoom(),9)); openPoint(f.lat,f.lon,{icao:f.icao,name:f.name}); };
      b.onclick=e=>{ if(e.target.closest("[data-del]")) return; go(); }; b.onkeydown=e=>{ if(e.key==="Enter") go(); }; });
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.favs.splice(+b.dataset.del,1); save(); renderFavs(); });
  };
  draw(S.favs.map(f=>WX[keyOf(f.lat,f.lon)]?.d||null));
  if(!S.favs.length) return;
  const ds=await loadWx(S.favs); if(panel==="favs") draw(ds);
}
const isFav=(lat,lon)=>S.favs.findIndex(f=>Math.abs(f.lat-lat)<.01&&Math.abs(f.lon-lon)<.01);

map.on("click",e=>openPoint(e.latlng.lat,e.latlng.lng));
map.on("movestart zoomstart",()=>{moving=true;const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);});
map.on("moveend",()=>{moving=false;renderAll();resetParticles();scheduleGrids();clearTimeout(map._mt);map._mt=setTimeout(drawMetars,300);});
let roPending=false;
map.on("mousemove",e=>{ if(roPending) return; roPending=true; requestAnimationFrame(()=>{ roPending=false;
  const f=FIELDS[S.field], v=fieldValue(e.latlng.lat,e.latlng.lng);
  $("readout").innerHTML=`${fmtCoord(e.latlng.lat,wrapLon(e.latlng.lng))}${f?.cmap?` · ${f.name} <b>${Number.isNaN(v)?"–":(Math.abs(v)<10&&f.unit!=="%"?v.toFixed(1):Math.round(v))} ${f.unit}</b>`:""}`; }); });
