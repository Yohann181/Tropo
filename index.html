<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a3442">
<title>Tropo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tropo">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="preconnect" href="https://tilecache.rainviewer.com">
<link rel="preconnect" href="https://api.met.no" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Poste de préparation des vols : rail à gauche, tiroir de panneaux, carte, altimètre à droite, frise temporelle en bas (thème cockpit sombre unique) */
:root{
  /* thème Ardoise (par défaut) : gris-bleu plus clair */
  --bg:#2a3442; --rail:#303b4b; --panel:#364354; --row:#3e4b5e; --row-h:#475670; --line:#506077;
  --sel:#2f6cb3; --fg:#f3f6fa; --muted:#b0bccc; --accent:#4f9dff;
  /* verre des fenêtres : couleur du thème, opacité et flou réglables (Réglages → Apparence) */
  --glass-rgb:54,67,84; --ga:.92; --glass:rgba(var(--glass-rgb),var(--ga)); --blur:6px; --mapbg:#1d2530;
  --vfr:#2ecc71; --mvfr:#3b8cf5; --ifr:#ef4444; --lifr:#d946ef; --warn:#f5b83b;
  --track:rgba(255,255,255,.09); --rain:#7fc3ff; --knob:#f3f6fa;
  /* icônes météo, boussole et lune : leurs couleurs suivent le thème (le thème Clair les fonce) */
  --wc-sun:#ffcf3f; --wc-moon:#d5ddee; --wc-cloud:#eef3fb; --wc-over:#c9d3e2; --wc-snow:#dfe6f0; --wc-storm:#9aa8bd;
  --wc-none:#5b6b82; --wc-fog:#b9c4d6; --wc-drop:#5fb0ff; --wc-flake:#eef3fb; --wc-edge:none;
  --cmp-bg:#151d29; --cmp-ring:#2f3e54; --cmp-tick:#5b6b82; --cmp-lab:#8fa0b8; --cmp-n:#ff8a8a;
  --moon-dark:#2a3346; --moon-lit:#f1ead2; --moon-ring:#5b6b82;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --railw:72px; --drawerw:370px; --footh:96px; --ts:1;
  color-scheme:dark;
}
/* thème Nuit (l'ancien bleu nuit) */
:root[data-theme="nuit"]{--bg:#151d29;--rail:#1a2332;--panel:#1f2a3a;--row:#243246;--row-h:#2a3a51;--line:#2f3e54;--sel:#1e4f86;--fg:#e8eef6;--muted:#8fa0b8;--accent:#3b8cf5;--glass-rgb:31,42,58;--mapbg:#0e141d;--knob:#e8eef6}
/* thème Clair (pour le jour ; « Automatique » le prend entre le lever et le coucher du soleil) */
:root[data-theme="clair"]{--bg:#e8edf4;--rail:#dce3ed;--panel:#f6f8fb;--row:#e3e9f1;--row-h:#d5deea;--line:#c2cddb;--sel:#cfe1f9;--fg:#132030;--muted:#506078;--accent:#1d6ad0;
  --glass-rgb:246,248,251;--mapbg:#d6dde6;--warn:#9a5b00;--track:rgba(19,32,48,.12);--rain:#1867c6;--knob:#fff;
  --wc-sun:#f2a516;--wc-moon:#8492b0;--wc-cloud:#d3dbe6;--wc-over:#a9b5c6;--wc-snow:#c4cedb;--wc-storm:#7b889c;--wc-none:#9aa6b6;--wc-fog:#8592a7;--wc-drop:#2b7fd9;--wc-flake:#8ea5c2;--wc-edge:#7d8ba0;
  --cmp-bg:#eef2f7;--cmp-ring:#c2cddb;--cmp-tick:#8a97aa;--cmp-lab:#506078;--cmp-n:#d63c3c;
  --moon-dark:#c3ccd8;--moon-lit:#fff7dc;--moon-ring:#8a97aa;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden;font-variant-numeric:tabular-nums}
/* iPhone : pas de rebond de la page, pas de zoom de la page entière au pincement ni au double toucher.
   La carte garde son propre zoom (Leaflet gère le pincement sur la carte). */
html,body{overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
button,a,[role=button],input,select,label{touch-action:manipulation}
#dBody,.scroll,#widgets{overscroll-behavior:contain}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#rail{position:fixed;left:0;top:0;bottom:0;width:var(--railw);background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;padding-top:env(safe-area-inset-top,0px);z-index:1200}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11px}
.rbtn svg{width:24px;height:24px}
.rbtn:hover{color:var(--fg)}
.rbtn[aria-pressed="true"]{color:var(--accent)}
#rail .spacer{flex:1}
.brand{display:grid;justify-items:center;gap:2px;padding:12px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand span{font:800 11px var(--ui);letter-spacing:.16em;color:var(--fg)}

#stage{position:fixed;left:var(--railw);top:0;right:0;bottom:var(--footh)}
body.drawer-open #stage{left:calc(var(--railw) + var(--drawerw))}
#map{position:absolute;inset:0;background:var(--mapbg)}
#busy{position:absolute;left:0;right:0;top:0;height:3px;z-index:1200;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
#busy.on{opacity:1}
#busy::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-30%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:busy 1.1s ease-in-out infinite}
@keyframes busy{to{left:100%}}
@media (prefers-reduced-motion:reduce){#busy::after{animation:none;left:0;width:100%;opacity:.6}}
#particles{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:401}

#toolbar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:1100;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#toolbar > *{pointer-events:auto}
.tb{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;color:var(--fg)}
.tb svg{width:16px;height:16px}
.tb[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
.tb.ad{font-family:var(--mono);font-size:12px}
#readout{margin-left:auto;font:12px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#readout b{color:var(--fg);font-weight:600}

/* Altimètre */
#alt{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 8px 10px;display:grid;justify-items:center;gap:6px;width:78px}
#alt .k{font:700 10px var(--ui);letter-spacing:.08em;color:var(--muted)}
#altVal{font:700 13px var(--mono);color:var(--fg);text-align:center;line-height:1.15}
#altVal small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.altbody{position:relative;height:230px;width:62px}
#altR{writing-mode:vertical-lr;direction:rtl;height:230px;width:22px;margin:0;position:absolute;left:4px;top:0;accent-color:var(--accent)}
.altticks{position:absolute;left:30px;top:0;bottom:0;width:34px;font:9.5px var(--mono);color:var(--muted)}
.altticks button{position:absolute;left:0;transform:translateY(50%);background:none;border:0;padding:0 2px;cursor:pointer;color:var(--muted);font:9.5px var(--mono)}
.altticks button:hover{color:var(--fg)}

#drawer{position:fixed;left:var(--railw);top:0;bottom:var(--footh);width:var(--drawerw);background:var(--panel);border-right:1px solid var(--line);
  z-index:1150;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#drawer > header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#drawer h2{margin:0;font-size:15px;font-weight:700}
.x{background:var(--row);border:0;border-radius:50%;width:28px;height:28px;cursor:pointer;display:grid;place-items:center}
#dBody{overflow:auto;flex:1;min-height:0}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;background:var(--rail)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:var(--panel);text-align:left;cursor:pointer;text-decoration:none;color:var(--fg)}
.row:hover{background:var(--row-h)}
.row[aria-pressed="true"],.row[aria-checked="true"]{background:var(--sel)}
.row .ic{width:32px;height:32px;border-radius:6px;background:var(--row);display:grid;place-items:center;flex:none}
.row .ic svg{width:20px;height:20px}
.row .t{font-weight:600;flex:1;min-width:0}
.row .s{font-size:11px;color:var(--muted);font-weight:400}
.sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.row[aria-pressed="true"] .sw{background:var(--accent)}
.row[aria-pressed="true"] .sw::after{left:17px}
.ctrl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ctrl label{color:var(--muted);font-size:12px;min-width:84px}
.ctrl input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font:600 11px var(--mono);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{padding:10px 14px;color:var(--muted);font-size:12px;line-height:1.5}
input.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);font:13px var(--ui)}
.field{padding:10px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.field label{font-size:12px;color:var(--muted)}
.key-miss{color:var(--warn);font-size:11px}

.pt-head{padding:12px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.pt-coord{font:600 14px var(--mono)}
.pt-sub{color:var(--muted);font-size:12px}
.pt-sub b{color:var(--fg)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-decoration:none;background:var(--row);border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--fg);width:max-content}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tile{background:var(--panel);padding:9px 12px;min-width:0}
.tile .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:600 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:11px;color:var(--muted);font-weight:400}
.tile .h{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metar{margin:10px 14px;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-word}
.cat{display:inline-block;padding:1px 7px;border-radius:4px;font:700 11px var(--mono);color:#fff;margin-right:6px}
.cat.VFR{background:var(--vfr)}.cat.MVFR{background:var(--mvfr)}.cat.IFR{background:var(--ifr)}.cat.LIFR{background:var(--lifr)}.cat.UNK{background:#6d7d94}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font:700 12px var(--mono);color:#0d1418}
.pill.ok{background:var(--vfr)}.pill.warn{background:#f5b83b}.pill.bad{background:var(--ifr)}
.xw{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:10px 14px;align-items:center;font:12px var(--mono);border-bottom:1px solid var(--line)}
.xw input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--fg);font:12px var(--mono)}
.scroll{overflow-x:auto}
table.dt{border-collapse:collapse;font:11.5px var(--mono);font-variant-numeric:tabular-nums;width:100%}
table.dt th,table.dt td{padding:4px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.dt th{color:var(--muted);font-weight:600;background:var(--panel)}
table.dt td:first-child,table.dt th:first-child{text-align:left}
table.dt tr.cur td{background:var(--sel)}
.flag{color:#67e8f9}
#profile{display:block;width:100%;height:auto;padding:6px 8px}

/* Marqueurs aérodromes */
.apt{position:relative;width:12px;height:12px}
.apt i{position:absolute;inset:2px;border-radius:50%;border:2px solid currentColor;background:#0e141d;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.apt b{position:absolute;left:14px;top:-3px;font:600 10.5px var(--mono);color:#e8eef6;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;display:none}
.apt b span{color:#8fa0b8;font-weight:400}
.zl .apt b{display:block}
.apt.VFR{color:var(--vfr)}.apt.MVFR{color:var(--mvfr)}.apt.IFR{color:var(--ifr)}.apt.LIFR{color:var(--lifr)}.apt.UNK{color:#7b8aa0}

#foot{position:fixed;left:var(--railw);right:0;bottom:0;height:var(--footh);background:var(--rail);border-top:1px solid var(--line);z-index:1200;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
#legendRow{display:flex;align-items:center;gap:10px;min-width:0}
#legName{font-weight:700;font-size:12px;white-space:nowrap}
#legBar{flex:1;height:8px;border-radius:4px;min-width:60px}
#legLab{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--muted)}
#legWrap{flex:1;display:grid;gap:2px;min-width:0}
#status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
#tl{display:flex;align-items:center;gap:8px;min-width:0}
.tbtn{background:var(--row);border:1px solid var(--line);border-radius:6px;height:28px;min-width:30px;padding:0 8px;cursor:pointer;font:700 11px var(--mono)}
.tbtn svg{width:14px;height:14px;vertical-align:middle}
#trackWrap{flex:1;position:relative;min-width:0;height:34px}
#slider{position:absolute;left:0;right:0;top:0;width:100%;margin:0;accent-color:var(--accent)}
#ticks{position:absolute;left:8px;right:8px;top:20px;height:12px;font:10px var(--mono);color:var(--muted)}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#ticks span.now{color:var(--ifr);font-weight:700}
#tLabel{font:600 12px var(--mono);white-space:nowrap;min-width:200px;text-align:right}
#tLabel .k{display:block;font-size:10px;color:var(--muted);font-weight:400}

.leaflet-container{background:var(--mapbg);font-family:var(--ui)}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-tooltip{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:11.5px/1.45 var(--mono);max-width:360px;white-space:normal}
.leaflet-div-icon{background:none;border:0}

/* Widgets sur la carte */
#widgets{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));z-index:1090;display:flex;flex-direction:column;gap:8px;width:calc(224px * var(--ts));pointer-events:none;max-height:calc(100% - 300px);overflow:hidden}
#widgets.left{left:10px} #widgets.right{right:100px}
#widgets.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 46px),transparent);mask-image:linear-gradient(#000 calc(100% - 46px),transparent)}
.wg{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.noblur .wg{-webkit-backdrop-filter:none;backdrop-filter:none}
/* taille du texte : le contenu des widgets et des panneaux est agrandi, pas la carte */
.wg>*{zoom:var(--ts)}
#dBody{zoom:var(--ts)}
#dBody .wg>*{zoom:1}
/* widgets déplaçables (mode modification) */
.wi{position:relative;pointer-events:auto;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#widgets.edit .wi{touch-action:none;cursor:grab}
#widgets.edit .wi .wg{outline:1.5px dashed var(--accent);outline-offset:-1.5px}
#widgets.edit .wi .wk{padding-right:22px}
.wi.drag{z-index:5;cursor:grabbing}
.wi.drag .wg,.chip.wi.drag{box-shadow:0 12px 30px rgba(0,0,0,.45)}
.wx{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ifr);color:#fff;font:700 15px/1 var(--ui);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.wbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:6;padding:6px;margin:-6px -6px 0;border-radius:10px;background:rgba(var(--glass-rgb),.88)}
.wbar button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 12px var(--ui);color:var(--fg);cursor:pointer}
.wbar button[data-we="done"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* contenus des nouveaux widgets */
.wsvg{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.wsvg text{font:600 9.5px var(--mono);fill:var(--muted)}
.wsvg .tv{fill:var(--fg)}
.wmini .tv{color:var(--muted);font-weight:400}
.sunlab{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted);margin:-2px 0 4px}
.sunlab b{color:var(--fg);font-weight:600}
.d10 .d5{grid-template-columns:32px 22px 27px minmax(28px,1fr) 27px;gap:6px;padding:4px 0;font-size:11.5px}
.d10 .d5 .pp{font-size:8.5px}
.d10 .d5 .ico svg{width:20px;height:20px}
.aqdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.cbars{display:grid;gap:4px;margin-top:8px}
.cbar{display:grid;grid-template-columns:50px 1fr 38px;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted)}
.cbar i{display:block;height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.cbar b{display:block;height:100%;border-radius:4px;background:var(--accent);opacity:.75}
.cbar em{font-style:normal;color:var(--fg);text-align:right}
.wstale{pointer-events:auto;font:600 11px var(--ui);color:var(--warn);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
/* boussole : l'aiguille pivote jusqu'au vent, et oscille quand il y a des rafales */
@keyframes wv{from{transform:rotate(var(--from))}}
@keyframes wob{from{transform:rotate(calc(var(--to) - var(--amp)))}to{transform:rotate(calc(var(--to) + var(--amp)))}}
.needle{transform-box:view-box;transform-origin:32px 32px;transform:rotate(var(--to));animation:wv .9s cubic-bezier(.2,.8,.2,1)}
.needle.gust{animation:wv .9s cubic-bezier(.2,.8,.2,1),wob 1.8s ease-in-out .9s infinite alternate}
.eco .needle,.wprev .needle{animation:none}
/* bibliothèque des widgets (panneau Widgets) */
.wl{display:grid;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.wlh{display:flex;align-items:center;gap:8px}
.wlh .ic{width:30px;height:30px;border-radius:6px;background:var(--row);display:grid;place-items:center;flex:none}
.wlh .ic svg{width:18px;height:18px}
.wlh .t{flex:1;min-width:0;font-weight:600}
.wlh .s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.wlh .linkbtn{cursor:pointer;padding:6px 10px;flex:none}
.linkbtn.add{background:var(--accent);border-color:var(--accent);color:#fff}
.mini{background:var(--row);border:1px solid var(--line);border-radius:6px;width:30px;height:28px;cursor:pointer;color:var(--fg);font:600 13px var(--ui);padding:0;flex:none}
.mini:disabled{opacity:.35;cursor:default}
.wprev{pointer-events:none;max-width:250px}
.wprev .wg{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--rail)}
/* Palette Ctrl+K, message, comparateur (v7.0.2) */
#pal{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.4);display:flex;justify-content:center;align-items:flex-start;padding:calc(12vh + env(safe-area-inset-top,0px)) 12px 12px}
.pbox{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
#palIn{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 16px var(--ui);padding:14px 16px;outline:none}
#palList{overflow:auto;min-height:0}
.pi{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.pi[aria-selected="true"]{background:var(--sel)}
.pi .ic{width:28px;height:28px;border-radius:6px;background:var(--row);display:grid;place-items:center;flex:none}
.pi .ic svg{width:17px;height:17px}
.pi .t{flex:1;min-width:0;font-weight:600}
.pi .s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.phint{font-size:11px;color:var(--muted);padding:7px 14px;background:var(--rail)}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2500;max-width:min(420px,calc(100% - 24px));background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:13px}
.cmpsel{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 10px}
.cmpc{display:flex;align-items:center;gap:6px;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;font-weight:600;max-width:100%}
.cmpc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmpc i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.cmpt td:first-child,.cmpt th:first-child{text-align:left;color:var(--muted)}
.cmpt th{white-space:normal;max-width:90px}
.cmpch{padding:6px 14px 2px}
.cmpch .k{font-size:11px;color:var(--muted);font-weight:600}
/* Réglages en onglets */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;background:var(--rail);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.tabs button{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:7px 6px;font:600 12px var(--ui);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.frow{display:flex;align-items:center;gap:6px;padding:7px 14px;border-bottom:1px solid var(--line)}
.frow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.frow .t small{color:var(--muted);font:500 11px var(--mono);margin-left:6px}
.wk{font:700 10px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.wk > span:first-child{white-space:nowrap}
.wk .wn{text-transform:none;letter-spacing:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
#widgets{overflow-y:auto;scrollbar-width:thin}
.wrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.wbig{font:600 22px var(--mono);line-height:1.1}
.wbig small{font-size:12px;color:var(--muted);font-weight:400}
.wmini{font:11.5px/1.5 var(--mono);color:var(--muted);min-width:0}
.wmini b{color:var(--fg);font-weight:600}
/* Prévisions 5 jours (façon Météo d'Apple) */
#fc5{position:absolute;left:10px;bottom:12px;z-index:1090;width:calc(310px * var(--ts));max-width:calc(100% - 110px)}
#fc5 .wk button{background:none;border:0;color:var(--muted);cursor:pointer;font:600 14px var(--ui);padding:0 2px}
.d5{display:grid;grid-template-columns:44px 30px 36px minmax(40px,1fr) 36px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font:600 13px var(--ui)}
.d5:first-of-type{border-top:0}
.d5 .ico{display:grid;justify-items:center;line-height:1}
.d5 .pp{font-size:9.5px;color:var(--rain);font-weight:700;margin-top:1px}
.d5 .lo{color:var(--muted);text-align:right;font-family:var(--mono)}
.d5 .hi{font-family:var(--mono)}
.d5 .bar{position:relative;height:5px;border-radius:3px;background:var(--track)}
.d5 .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
/* repère de la température actuelle : cerclé de foncé en thème Clair, sinon on ne le voit pas sur la barre */
:root[data-theme="clair"] .d5 .bar b{border-color:#132030}
.d5 .bar b{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;border:1.5px solid var(--panel)}
.pt-fc5{padding:4px 14px 8px;border-bottom:1px solid var(--line)}
/* Favoris */
.fav{position:relative;display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:12px 14px;margin:8px 10px;border-radius:14px;background:linear-gradient(135deg,#2f5f96,#1d3557);cursor:pointer;border:0;color:#fff;
  /* cartes bleues dans tous les thèmes : icônes aux couleurs du thème sombre */
  --wc-sun:#ffcf3f;--wc-moon:#d5ddee;--wc-cloud:#eef3fb;--wc-over:#c9d3e2;--wc-snow:#dfe6f0;--wc-storm:#9aa8bd;--wc-none:#5b6b82;--wc-fog:#b9c4d6;--wc-drop:#5fb0ff;--wc-flake:#eef3fb;--wc-edge:none}
.fav.night{background:linear-gradient(135deg,#232f52,#141b30)}
.fav:focus-visible{outline:2px solid var(--accent)}

.fs{font-size:12px;color:#d3def0;display:flex;align-items:center;gap:5px}
.fh{font-size:12px;color:#d3def0;text-align:right}
.favx{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.25);border:0;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;color:#fff;opacity:0}
.fav:hover .favx,.fav:focus-within .favx{opacity:1}
.favform{display:flex;gap:6px}
.favform input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg);font:12px var(--ui)}
/* Réglages → Diagnostic */
.diag{margin:4px 14px 10px;font:11px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-word;color:var(--muted)}
.diag b{color:var(--fg);font-weight:600}
.diag .e{display:block;padding:2px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;padding:2px 14px 10px}
.btns .linkbtn{cursor:pointer;padding:8px 12px}
#diagTxt{display:block;width:calc(100% - 28px);height:150px;margin:0 14px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:11px/1.45 var(--mono)}

@media (max-width:760px){
  :root{--railw:0px;--drawerw:100%;--footh:124px}
  /* mode téléphone : une seule ligne de pastilles, le détail s'ouvre au toucher */
  #widgets,#widgets.left,#widgets.right{left:10px;right:10px;width:auto;top:calc(54px + env(safe-area-inset-top,0px));flex-direction:row;gap:6px;overflow-x:auto;overflow-y:hidden;max-height:none!important;scrollbar-width:none;padding-bottom:2px}
  #widgets::-webkit-scrollbar{display:none}
  :root{--glass:rgba(var(--glass-rgb),.94)}
  .chip{pointer-events:auto;flex:none;display:flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 calc(12px * var(--ts)) var(--mono);color:var(--fg);cursor:pointer;white-space:nowrap;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
  .chip svg{flex:none}
  /* mode modification : pastilles à glisser, avec leur × ; « Terminé » en tête de rangée */
  #widgets.edit .chip.wi{border:1.5px dashed var(--accent);padding-right:4px;cursor:grab}
  .chip .wx{position:static;width:20px;height:20px;font-size:13px;margin-left:2px;box-shadow:none}
  .chip.wb{font-family:var(--ui)}
  .chip.wst{color:var(--warn);cursor:default}
  .chip.wb.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #wpop{position:absolute;left:10px;right:10px;top:calc(92px + env(safe-area-inset-top,0px));z-index:1095}
  #wpop .wg{max-width:calc(320px * var(--ts))}
  #fc5{left:10px;right:10px;bottom:auto;top:calc(92px + env(safe-area-inset-top,0px));width:auto;max-width:none}
  #alt{display:none}
  body.alt-open #alt{display:grid;right:8px;top:calc(92px + env(safe-area-inset-top,0px));bottom:auto}
  .wbig{font-size:18px}
  body.drawer-open #fc5,body.drawer-open #widgets,body.drawer-open #wpop{display:none}
  .favx{opacity:1}
  #rail{top:auto;bottom:var(--footh);left:0;right:0;width:auto;height:56px;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding-top:0}
  #rail .spacer,.brand{display:none}
  .rbtn{flex:1;padding:6px 2px}
  #stage,body.drawer-open #stage{left:0;bottom:calc(var(--footh) + 56px)}
  #drawer{left:0;right:0;width:auto;top:auto;bottom:calc(var(--footh) + 56px);height:60%;border-right:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0}
  #toolbar .hide-m{display:none}
  /* v7.0.3 : une seule ligne de boutons sur téléphone (avant, « LFBO » passait à la ligne et recouvrait les pastilles) ;
     le niveau (SFC, FL300…) est déjà sur le bouton Altitude, et le nom du champ se raccourcit s'il manque de place */
  #toolbar{flex-wrap:nowrap}
  #tbWx{min-width:0;flex:0 1 auto} #tbWx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #tbWx .lvl{display:none}
  #toolbar > .tb:not(#tbWx){flex:none}
  #readout{display:none}
  #tl{flex-wrap:wrap;row-gap:4px}
  #tLabel{order:-1;width:100%;text-align:left;min-width:0;font-size:11px}
  #tLabel .k{display:inline;margin-right:6px}
  #ticks{display:none}
  #trackWrap{height:28px}
  #status{display:none}
  #alt{width:80px;transform:none}
  .altbody,#altR{height:170px}
  body.drawer-open #alt{display:none!important}
  #tbAlt{display:flex!important}
  /* iOS zoome toute la page quand on touche un champ écrit en moins de 16 px */
  input,select,textarea{font-size:16px!important}
  /* le flou derrière les fenêtres coûte cher au processeur graphique quand les particules bougent dessous */
  .wg{-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){#particles{display:none}.needle{animation:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* Tropo — sources gratuites, sans clé (sauf OpenAIP, clé perso gratuite) :
   Open-Meteo (modèles Météo-France / ECMWF / GFS, qualité de l'air), RainViewer (radar),
   VATSIM (relais des METAR réels), OurAirports (aérodromes), NOAA SWPC (indice Kp),
   NASA GIBS (satellite), Esri (fonds), OpenAIP, FAA. */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const isMobile=()=>matchMedia("(max-width:760px)").matches;
const RAD=Math.PI/180;
const VERSION="7.0.3";

// ---------- Journal technique (diagnostic, surtout pour l'iPhone) ----------
/* Garde sur l'appareil les 40 derniers incidents (erreurs, plantages probables, canvas refusés, sources en panne),
   affichés dans Réglages → Diagnostic. Le « battement » sert à reconnaître une appli qui s'est relancée toute seule
   pendant qu'on l'utilisait : c'est ce que fait Safari quand une page prend trop de mémoire. */
const jread=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
function jlog(type,msg,win=10e3){
  try{
    const L=jread("rb3log")||[], now=Date.now(), m=String(msg??"").replace(/\s+/g," ").trim().slice(0,300);
    if(L.some(x=>x.ty===type&&x.m===m&&now-x.t<win)) return;      // pas de doublon à moins de 10 s
    L.push({t:now,ty:type,m,v:VERSION}); localStorage.setItem("rb3log",JSON.stringify(L.slice(-40)));
  }catch(e){}
}
addEventListener("error",e=>jlog("erreur",`${e.message||"erreur inconnue"}${e.lineno?` · ligne ${e.lineno}:${e.colno}`:""}`));
addEventListener("unhandledrejection",e=>{ const r=e.reason; jlog("promesse",r?.message||String(r)); });
function beat(vis){ try{ localStorage.setItem("rb3beat",JSON.stringify({t:Date.now(),vis,v:VERSION})); }catch(e){} }
// un autre onglet Tropo ouvert et vivant répond « pong » : son battement récent n'est alors pas un plantage
const BC=typeof BroadcastChannel==="function"?new BroadcastChannel("tropo"):null;
if(BC) BC.onmessage=e=>{ if(e.data==="ping") BC.postMessage("pong"); };
(function(){ // au lancement : un battement « visible » de moins de 90 s = relance pendant l'utilisation
  const b=jread("rb3beat"); if(!b||!b.vis||!(Date.now()-b.t<90e3)) return;
  const age=Math.max(0,Math.round((Date.now()-b.t)/1000));
  const crash=()=>{ const c=jread("rb3crash")||{n:0,since:Date.now()}; c.n++; try{ localStorage.setItem("rb3crash",JSON.stringify(c)); }catch(e){}

const ucv=(k,v)=>v==null||Number.isNaN(+v)?null:(UNITS[k][S.units[k]]||Object.values(UNITS[k])[0])[1](+v);
const nf=(v,d=0)=>v==null||Number.isNaN(+v)?"–":(+v).toFixed(d);

function hm(t,off=0){ if(t==null) return "–"; const d=new Date((t+off)*1000), h=d.getUTCHours(), m=String(d.getUTCMinutes()).padStart(2,"0");

const PL=[1000,975,950,925,900,850,800,700,600,500,400,300,250,200,150];

function levelSpec(){
  if(!S.alt) return null;
  const p=altP(S.alt);
  if(p>=PL[0]) return {lo:PL[0],hi:PL[0],w:0};
  if(p<=PL[PL.length-1]) return {lo:PL[PL.length-1],hi:PL[PL.length-1],w:0};
  for(let i=0;i<PL.length-1;i++) if(p<=PL[i]&&p>=PL[i+1]) return {lo:PL[i],hi:PL[i+1],w:(Math.log(PL[i])-Math.log(p))/(Math.log(PL[i])-Math.log(PL[i+1]))};
}

let entries=[], tIdx=0, nowIdx=0, playTimer=null, tRaf=0, ptTimer=null;

function zt(t){const d=new Date(t*1000);return `${String(d.getUTCHours()).padStart(2,"0")}${String(d.getUTCMinutes()).padStart(2,"0")}Z`;}
function lt(t){return S.units.h==="12"?hm(t,-new Date(t*1000).getTimezoneOffset()*60):new Date(t*1000).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
// décalage (s) d'un fuseau horaire (« Europe/Paris ») à l'instant t (ms), quel que soit le fuseau de l'appareil
const TZF={};
function tzOffset(tz,t=Date.now()){
  if(tz) try{
    // hour12:false marche sur tous les navigateurs ; certains anciens écrivent minuit « 24 », d'où le %24 plus bas
    const f=TZF[tz]||(TZF[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"}));
    const p={}; for(const x of f.formatToParts(new Date(t))) p[x.type]=x.value;
    return Math.round((Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(t/1000)*1000)/1000);
  }catch(e){}
  return -new Date(t).getTimezoneOffset()*60;
}
// heure qu'il est dans un fuseau donné (sinon avec un décalage connu)
function hhmm(tz,off){ const now=Date.now()/1000; if(S.units.h==="12") return hm(now,tz?tzOffset(tz):(off||0));
  try{ if(tz) return new Date().toLocaleTimeString("fr-FR",{timeZone:tz,hour:"2-digit",minute:"2-digit"}); }catch(e){} return new Date((now+(off||0))*1000).toISOString().slice(11,16); }
function buildEntries(){
  // si on regardait « maintenant », on reste sur le nouveau « maintenant » (dernière image radar) après un rechargement
  const atNow=entries.length>0&&tIdx===nowIdx, keepT=entries.length?curT():null;
  const radar=rFrames.map((f,i)=>({t:f.time,kind:"radar",i}));
  const last=radar.length?radar[radar.length-1].t:Date.now()/1000, first=radar.length?radar[0].t:Date.now()/1000;
  // v7.0.2 : les 24 dernières heures du modèle (cartes, particules, widgets), avant les 2 h du radar ; puis la prévision jusqu'à +72 h
  const h0=Math.floor(Date.now()/3600e3)*3600, past=[], fc=[];
  for(let h=-24;h<=0;h++){ const t=h0+h*3600; if(t<first-600) past.push({t,kind:"past"}); }
  for(let h=1;h<=72;h++){ const t=h0+h*3600; if(t>last+600) fc.push({t,kind:"fc"}); }
  entries=[...past,...radar,...fc];
  nowIdx=radar.length?past.length+radar.length-1:Math.max(0,past.length-1);
  tIdx=keepT===null||atNow?nowIdx:entries.reduce((b,e,i)=>Math.abs(e.t-keepT)<Math.abs(entries[b].t-keepT)?i:b,0);
  $("slider").max=entries.length-1; $("slider").value=tIdx;
  const ticks=$("ticks"); ticks.innerHTML="";
  entries.forEach((e,i)=>{
    const d=new Date(e.t*1000); let lab=null;
    if(i===nowIdx) lab="NOW";
    else if(e.kind==="past"&&i===0) lab="-24h";
    else if(e.kind==="radar"&&(i===0||entries[i-1].kind!=="radar")) lab="-2h";
    else if(e.kind==="fc"&&d.getUTCMinutes()===0&&d.getUTCHours()%6===0) lab=d.getUTCHours()===0?dayFr[d.getUTCDay()]:`${String(d.getUTCHours()).padStart(2,"0")}Z`;
    if(lab&&i!==nowIdx&&Math.abs(i-nowIdx)/(entries.length-1)<.04) lab=null;
    if(lab){ const s=document.createElement("span"); s.textContent=lab; if(i===nowIdx) s.className="now"; s.style.left=(i/(entries.length-1)*100)+"%"; ticks.appendChild(s); }
  });
  setTime(tIdx);
}
/* setTime(i) redessine tout de suite. setTime(i, true) sert au curseur de la frise : le libellé suit le doigt,
   mais les couches ne sont redessinées qu'une fois par image affichée (requestAnimationFrame), et sur téléphone
   la fiche Point attend 250 ms d'arrêt du curseur. */
function setTime(i,lent){
  tIdx=clamp(i,0,entries.length-1); $("slider").value=tIdx;
  const e=entries[tIdx]; if(!e) return;
  const rel=Math.round((e.t-Date.now()/1000)/3600), d=new Date(e.t*1000);
  const kind=e.kind==="radar"?(tIdx===nowIdx?"OBSERVATION · DERNIÈRE":"OBSERVATION RADAR"):e.kind==="past"?`PASSÉ · MODÈLE ${rel} h`:`PRÉVISION ${rel>=0?"+":""}${rel} h`;
  // le jour affiché est celui de l'heure Zulu (UTC) ; l'heure de l'appareil reste entre parenthèses
  $("tLabel").innerHTML=`<span class="k">${kind}</span>${dayFr[d.getUTCDay()]} ${d.getUTCDate()} · ${zt(e.t)} <span style="color:var(--muted)">(${lt(e.t)})</span>`;
  if(!lent){ if(tRaf){ cancelAnimationFrame(tRaf); tRaf=0; } drawTime(false); return; }
  if(!tRaf) tRaf=requestAnimationFrame(()=>{ tRaf=0; drawTime(true); });
}
function drawTime(lent){
  showRadar(); renderAll(); resetParticles(); renderWidgets();   // v7.0.2 : les widgets (et le comparateur) suivent l'heure de la frise
  if(panel==="cmp") drawCmp();
  if(!P) return;
  clearTimeout(ptTimer);
  if(lent&&isMobile()) ptTimer=setTimeout(()=>{ if(P) renderPoint(); },250); else renderPoint();
}

let rFrames=[], rLayers=[];
async function loadRadar(){
  try{

    rLayers.forEach(l=>map.removeLayer(l));

  }catch(e){ rFrames=[]; status("Radar indisponible"); jlog("données","radar RainViewer indisponible : "+e.message,30*60e3); }
  buildEntries();
}
function showRadar(){
  // économie d'énergie : seulement l'image affichée (la suivante n'est pas préchargée)
  const e=entries[tIdx], cur=S.radar&&e?.kind==="radar"?e.i:-1, nxt=cur>=0&&rLayers.length&&!S.eco?(cur+1)%rLayers.length:-1, mob=isMobile()||S.eco;
  if(cur>=0) [cur,nxt].forEach(k=>{ const l=rLayers[k]; if(l&&!map.hasLayer(l)) l.addTo(map); });
  // sur téléphone, seules l'image affichée et la suivante restent sur la carte : les autres rendent leurs tuiles
  rLayers.forEach((l,k)=>{ if(!map.hasLayer(l)) return; if(mob&&k!==cur&&k!==nxt) map.removeLayer(l); else l.setOpacity(k===cur?.8:0); });

// ---------- Grilles modèles ----------
/* Open-Meteo compte chaque point de grille comme une requête (limites gratuites ~600/min, 5 000/h, 10 000/jour).
   On charge une zone 2x plus grande que l'écran, par paquets de ≤10 variables (même coût qu'une seule), et on la réutilise. */
let GA=null, GM=null, GW=null, gridTimer=null, gridSeq=0, retryTimer=null, busy=false, again=false, arrCache=new Map();
/* v7.0.3 · grille de contexte GW : 8 × 8 points sur une zone 7 fois plus large que l'écran, demandée dans la même requête
   que la grille fine GA (64 points de plus, et seulement tous les deux crans de zoom). Quand on dézoome, elle couvre tout de suite l'écran (en plus grossier),
   le temps que la grille fine de la nouvelle vue arrive : plus de « carré » coloré au milieu d'une carte vide. */
const CTXN=8;
const wrapLon=x=>((x+540)%360)-180;
const SFC=["wind_speed_10m","wind_direction_10m","wind_gusts_10m","temperature_2m","relative_humidity_2m","cloud_cover_low","cloud_cover_mid","cloud_cover_high","cloud_cover","precipitation"];
const EXTRA=["pressure_msl","freezing_level_height","cape","visibility","dew_point_2m","uv_index"];
const groupOf=v=>SFC.includes(v)?"sfc":EXTRA.includes(v)?"extra":null;
const groupVars=g=>g==="sfc"?SFC:g==="extra"?EXTRA:["wind_speed","wind_direction","temperature","relative_humidity"].map(x=>`${x}_${g.slice(1)}hPa`);
function groupsFor(f){
  if(!f||f.marine||(!f.v&&!f.sfc)) return [];
  if(f.levels&&S.alt){ const L=levelSpec(); return ["p"+L.lo,"p"+L.hi]; }
  return [groupOf(f.v||f.sfc)];
}
// groupes utiles à la grille de contexte (v7.0.3) : champ coloré, particules, nuages et pluie ; pas les isobares ni le jet
function ctxGroups(){
  const f=FIELDS[S.field], g=new Set(f?.marine?[]:groupsFor(f));
  if(S.particles) groupsFor(FIELDS.wind).forEach(x=>g.add(x));
  if(S.ovRain||S.ovCloud) g.add("sfc");
  g.delete(null); return [...g];
}
function neededGroups(){
  const g=new Set(groupsFor(FIELDS[S.field]));
  if(S.particles||S.ovValues) groupsFor(FIELDS.wind).forEach(x=>g.add(x));
  if(S.ovRain||S.ovCloud) g.add("sfc");
  if(S.ovIso) g.add("extra");
  if(S.ovJet) g.add("p250");
  g.delete(null); return [...g];
}
function viewBox(pad){
  const b=map.getBounds().pad(pad);
  let s=clamp(b.getSouth(),-85,85), n=clamp(b.getNorth(),-85,85), w=b.getWest(), e=b.getEast();
  if(e-w>=300){w=-180;e=180;} else { const c=wrapLon((w+e)/2), half=(e-w)/2; w=c-half; e=c+half; }
  return {s,n,w,e};
}
function boxOk(ds){
  if(!ds||Date.now()-ds.at>90*60e3||ds.k!==GRIDN()) return false;
  const sz=map.getSize(); if(!sz.x||!sz.y) return true;   // carte pas encore affichée (appli en arrière-plan) : rien à charger
  const v=viewBox(0), vw=v.e-v.w, dw=ds.e-ds.w;
  const inside=ds.s<=v.s+.01&&ds.n>=v.n-.01&&(dw>=359||(ds.w<=v.w+.01&&ds.e>=v.e-.01));
  return inside && vw>dw/4.5;
}
function newBox(pad=.5,k=GRIDN()){ const b=viewBox(pad); return {s:+b.s.toFixed(2),n:+b.n.toFixed(2),w:+b.w.toFixed(2),e:+b.e.toFixed(2),k,at:Date.now(),groups:new Set(),data:{},times:null,id:Math.random()}; }
// la zone b est-elle entièrement dans la grille ds ?
function boxIn(ds,b){ const dw=ds.e-ds.w; return ds.s<=b.s+.01&&ds.n>=b.n-.01&&(dw>=359||(ds.w<=b.w+.01&&ds.e>=b.e-.01)); }
// faut-il (re)demander la grille de contexte ? oui si elle manque, a plus d'une heure, ou ne couvre plus un cran de dézoom
function ctxNeeded(){
  const fine=viewBox(.5), big=viewBox(3);
  if(fine.e-fine.w>=359&&big.s<=fine.s&&big.n>=fine.n) return false;   // la vue fine couvre déjà le monde
  return !GW||Date.now()-GW.at>60*60e3||!boxIn(GW,viewBox(.5));
}
function usage(add,win=3600e3){ // estimation des requêtes Open-Meteo consommées (heure ou 24 h glissantes)
  let u=[]; try{u=JSON.parse(localStorage.getItem("rb3use")||"[]");}catch(e){}
  const now=Date.now(); u=u.filter(x=>now-x[0]<864e5); if(add) u.push([now,add]);
  try{localStorage.setItem("rb3use",JSON.stringify(u));}catch(e){} return u.filter(x=>now-x[0]<win).reduce((a,x)=>a+x[1],0);
}
const GRIDN=()=>isMobile()?Math.min(S.grid,8):S.grid;
// Pause Open-Meteo : quand la limite est atteinte, on arrête de le solliciter jusqu'à la fin de la période
function omBlockedUntil(){ try{ return +localStorage.getItem("rb3block")||0; }catch(e){ return 0; } }
const omBlocked=()=>omBlockedUntil()>Date.now()||usage(0,864e5)>9300;
function omHitLimit(reason){
  const now=new Date(); let until;
  if(/Daily/i.test(reason)) until=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+1,0,5);
  else if(/Hourly/i.test(reason)) until=Date.now()+20*60e3; else until=Date.now()+65e3;
  try{ localStorage.setItem("rb3block",String(until)); }catch(e){}
  jlog("quota",`Open-Meteo en pause jusqu'à ${lt(until/1000)} (${reason||"limite"})`,30*60e3);
  return until;
}
// Cache des grilles sur l'appareil (IndexedDB) : une zone déjà chargée n'est pas redemandée pendant 90 min.
/* v7.0.3 : deux magasins. « meta » ne garde que la description de chaque grille (zone, heure, groupes) ; « grids » garde
   les données. Avant, chaque recherche relisait toutes les grilles en entier (jusqu'à 40 × 0,5 Mo), ce qui ralentissait
   le dézoom sur iPhone. Maintenant on lit les descriptions, puis seulement la grille choisie. */
const IDBS={p:null};
function idb(){ if(IDBS.p) return IDBS.p; IDBS.p=new Promise(res=>{ try{ const rq=indexedDB.open("tropo",2);
  rq.onupgradeneeded=e=>{ const db=rq.result;
    if(!db.objectStoreNames.contains("grids")) db.createObjectStore("grids",{keyPath:"key"});
    else if(e.oldVersion<2) rq.transaction.objectStore("grids").clear();   // anciennes grilles sans description : on repart à vide
    if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta",{keyPath:"key"}); };
  rq.onsuccess=()=>{ const db=rq.result; db.onversionchange=()=>db.close(); res(db); }; rq.onerror=()=>res(null); rq.onblocked=()=>res(null); }catch(e){ res(null); } }); return IDBS.p; }
async function idbMeta(){ const db=await idb(); if(!db) return []; return new Promise(res=>{ try{ const rq=db.transaction("meta").objectStore("meta").getAll();
  rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]); }catch(e){ res([]); } }); }
async function idbGet(key){ const db=await idb(); if(!db) return null; return new Promise(res=>{ try{ const rq=db.transaction("grids").objectStore("grids").get(key);
  rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }catch(e){ res(null); } }); }
async function idbPut(v){ const db=await idb(); if(!db) return; try{ const tx=db.transaction(["grids","meta"],"readwrite");
  tx.objectStore("grids").put(v); const {data,times,...m}=v; tx.objectStore("meta").put(m); }catch(e){} }
async function idbPrune(){ const all=await idbMeta(), db=await idb(); if(!db||!all.length) return;
  const sorted=all.sort((a,b)=>b.at-a.at), drop=sorted.filter((v,i)=>i>=50||Date.now()-v.at>6*3600e3||v.pv!==2);
  if(!drop.length) return;
  try{ const tx=db.transaction(["grids","meta"],"readwrite"); drop.forEach(v=>{ tx.objectStore("grids").delete(v.key); tx.objectStore("meta").delete(v.key); }); }catch(e){} }
function coversView(e){ const v=viewBox(0); return boxIn(e,v)&&v.e-v.w>(e.e-e.w)/4.5; }
// pv:2 = grilles avec 24 h de passé (v7.0.2) ; maxAge plus long pour afficher tout de suite une carte gardée, en attendant la mise à jour
// kind "ctx" : grille de contexte (v7.0.3), qui doit seulement contenir la vue
async function boxFromCache(kind,maxAge=90*60e3){
  const ctx=kind==="ctx", v=viewBox(0);
  const all=(await idbMeta()).filter(e=>e.kind===kind&&e.pv===2&&e.k===(ctx?CTXN:GRIDN())&&Date.now()-e.at<maxAge&&(ctx?boxIn(e,v):coversView(e)));
  if(!all.length) return null;
  const best=all.sort((a,b)=>b.at-a.at)[0], same=all.filter(e=>e.s===best.s&&e.n===best.n&&e.w===best.w&&e.e===best.e);
  const box={s:best.s,n:best.n,w:best.w,e:best.e,k:best.k,at:Math.min(...same.map(e=>e.at)),groups:new Set(),data:{},times:null,id:Math.random()};
  for(const m of same){ const e=await idbGet(m.key); if(!e) continue; box.times=box.times||e.times; Object.assign(box.data,e.data); e.groups.forEach(g=>box.groups.add(g)); }
  return box.times?box:null;
}
// une seule requête pour une ou plusieurs zones (grille fine + grille de contexte) : renvoie un résultat par zone
async function fetchGrid(kind,vars,box,...more){
  const boxes=[box,...more.filter(Boolean)], lats=[], lons=[];
  for(const bx of boxes){ const n=bx.k; for(let a=0;a<n;a++) for(let b=0;b<n;b++){ lats.push((bx.s+(bx.n-bx.s)*a/(n-1)).toFixed(2)); lons.push(wrapLon(bx.w+(bx.e-bx.w)*b/(n-1)).toFixed(2)); } }
  const base=kind==="marine"?"https://marine-api.open-meteo.com/v1/marine":"https://api.open-meteo.com/v1/forecast";
  const extra=kind==="marine"?"&past_days=1&forecast_days=3":"&past_hours=24&forecast_hours=72&wind_speed_unit=kn";   // v7.0.2 : 24 h de passé (même coût)
  usage(lats.length);
  const r=await fetch(`${base}?latitude=${lats.join(",")}&longitude=${lons.join(",")}&hourly=${vars.join(",")}&timeformat=unixtime${extra}`);
  const j=await r.json();
  if(r.status===429||/limit/i.test(j?.reason||"")){ const e=new Error(j?.reason||"limite"); e.limit=/Daily/i.test(j?.reason)?"jour":/Hourly/i.test(j?.reason)?"heure":"minute"; e.until=omHitLimit(j?.reason||""); throw e; }
  if(!Array.isArray(j)) throw new Error(j.reason||"réponse inattendue");
  const out=[]; let off=0;
  for(const bx of boxes){ const N=bx.k*bx.k; out.push(gridData(j.slice(off,off+N),vars,N)); off+=N; }
  return boxes.length>1?out:out[0];
}
function gridData(j,vars,N){

function fieldUnit(f){

const cv=$("particles"), ctx=cv.getContext("2d"); let parts=[], moving=false, cvW=0, cvH=0;
/* densité plafonnée à 2 : sur iPhone (×3), le canvas des particules pesait 2,25 fois plus lourd pour un gain invisible.
   La taille (cvW × cvH) n'est lue qu'ici, pas à chaque image de l'animation. */
function sizeCanvas(){ const d=Math.min(2,devicePixelRatio||1), r=cv.getBoundingClientRect(); cvW=r.width; cvH=r.height;
  cv.width=Math.round(cvW*d); cv.height=Math.round(cvH*d); ctx.setTransform(d,0,0,d,0,0); resetParticles(); }
// nombre de particules : selon la taille de l'écran, la densité choisie (Réglages → Performance), et moitié moins en économie d'énergie
function resetParticles(){
  ctx.clearRect(0,0,cvW,cvH);
  const base=isMobile()?Math.min(700,Math.round(cvW*cvH/2600)):Math.min(2600,Math.round(cvW*cvH/1000));
  const n=Math.round(base*S.pdens*(S.eco?.5:1));
  parts=Array.from({length:n},()=>({x:Math.random()*cvW,y:Math.random()*cvH,age:Math.random()*80|0}));
}
const PCOL=["#7aa2f7","#4fd1c5","#a3e635","#fbbf24","#f97316","#ef4444","#d946ef"];
let lastF=0;
// images par seconde des particules (v7.0.2) : choix de Réglages → Performance ; automatique = 60 sur ordinateur, 30 sur téléphone ; 15 en économie
const fpsNow=()=>S.eco?15:S.fps||(isMobile()?30:60);
function frame(ts){
  requestAnimationFrame(frame);
  if(document.hidden||!S.particles||!(GA?.times||GW?.times)||moving) return;
  const fps=fpsNow(), now=ts||performance.now(); if(now-lastF<1000/fps-4) return; lastF=now;
  const spd=S.pspeed*(fps<30?2:1);
  const A=GA?.times?GA:null, ti=A?tIndex(A,curT()):0, B=GW?.times?GW:null, t2=B?tIndex(B,curT()):0;
  const u=A&&levelArr(A,ti,"_u|wind_speed","_u|wind_speed_10m"), v=A&&levelArr(A,ti,"_v|wind_speed","_v|wind_speed_10m");
  // grille de contexte (v7.0.3) : les particules couvrent tout l'écran même juste après un dézoom
  const u2=B&&levelArr(B,t2,"_u|wind_speed","_u|wind_speed_10m"), v2=B&&levelArr(B,t2,"_v|wind_speed","_v|wind_speed_10m");
  if(!(u&&v)&&!(u2&&v2)) return;
  const mono=FIELDS[S.field]?.cmap;
  ctx.globalCompositeOperation="destination-in"; ctx.fillStyle="rgba(0,0,0,.9)"; ctx.fillRect(0,0,cvW,cvH);
  ctx.globalCompositeOperation="source-over"; ctx.lineWidth=1.1;
  for(const p of parts){
    const ll=map.containerPointToLatLng([p.x,p.y]);
    let a=u&&v?sampleArr(A,u,ll.lat,ll.lng):NaN, b;
    if(Number.isNaN(a)&&u2&&v2){ a=sampleArr(B,u2,ll.lat,ll.lng); b=sampleArr(B,v2,ll.lat,ll.lng); } else if(!Number.isNaN(a)) b=sampleArr(A,v,ll.lat,ll.lng);
    if(Number.isNaN(a)||p.age++>90){ p.x=Math.random()*cvW; p.y=Math.random()*cvH; p.age=0; continue; }
    const s=Math.hypot(a,b), k=Math.min(0.07,5/(s||1))*spd, nx=p.x+a*k, ny=p.y-b*k;
    ctx.strokeStyle=mono?"rgba(255,255,255,.75)":PCOL[Math.min(6,Math.floor(s/10))];
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(nx,ny); ctx.stroke(); p.x=nx; p.y=ny;
  }
}

function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true; else if(c===","){row.push(f);f="";} else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";} else if(c!=="\r")f+=c;}
  if(f||row.length){row.push(f);rows.push(row);} return rows;}
async function loadMetarText(){
  const t=await (await fetch("https://metar.vatsim.net/metar.php?id=all",{cache:"no-store"})).text();
  const m={}; for(const l of t.split("\n")){ const id=l.slice(0,4); if(/^[A-Z0-9]{4}$/.test(id)) m[id]=l.trim(); }
  METARS=m;
}
// lit un gros fichier texte ligne par ligne, au fil du téléchargement, sans jamais le garder en entier en mémoire
async function eachLine(url,fn){
  const r=await fetch(url); if(!r.ok) throw new Error(`${url.split("/").pop()} : erreur ${r.status}`);
  const out=s=>fn(s.endsWith("\r")?s.slice(0,-1):s);
  if(!r.body?.getReader||typeof TextDecoder!=="function"){ const t=await r.text(); let a=0; for(let b;(b=t.indexOf("\n",a))>=0;a=b+1) out(t.slice(a,b)); if(a<t.length) out(t.slice(a)); return; }
  const rd=r.body.getReader(), dec=new TextDecoder(); let rest="";
  for(;;){ const {done,value}=await rd.read(); rest+=done?dec.decode():dec.decode(value,{stream:true});
    let a=0; for(let b;(b=rest.indexOf("\n",a))>=0;a=b+1) out(rest.slice(a,b));
    rest=rest.slice(a); if(done) break; }
  if(rest) out(rest);
}
/* Base des aérodromes (OurAirports, environ 12 Mo) : lue ligne par ligne. Seules les lignes d'un aérodrome
   qui a un METAR sont découpées en champs ; on les repère d'abord par leur code, avec une expression régulière. */
async function buildStations(){
  try{ const c=JSON.parse(localStorage.getItem("rb2st")||"null"); if(c&&c.v===1&&Date.now()-c.at<30*864e5){ ST=c.st; return; } }catch(e){}
  status("Première ouverture : téléchargement de la base des aérodromes (une seule fois)…");
  const ids=new Set(Object.keys(METARS)), st={};
  const quick=(n,f)=>{ if(n<0) throw new Error(`${f} : colonne introuvable, format inattendu`); return new RegExp(`^(?:[^,]*,){${n}}"?([A-Z0-9]{4})"?,`); };
  let A=null, re=null;
  await eachLine(OA+"airports.csv",l=>{
    if(!A){ const H=parseCSV(l)[0]||[], ix=k=>H.indexOf(k); A={id:ix("ident"),la:ix("latitude_deg"),lo:ix("longitude_deg"),el:ix("elevation_ft"),nm:ix("name")}; re=quick(A.id,"airports.csv"); return; }
    const m=re.exec(l); if(!m||!ids.has(m[1])||st[m[1]]) return;
    const r=parseCSV(l)[0]; if(!r||r[A.id]!==m[1]) return;
    st[m[1]]=[+(+r[A.la]).toFixed(3),+(+r[A.lo]).toFixed(3),+r[A.el]||0,(r[A.nm]||"").slice(0,48),[]];
  });
  let R=null; re=null;
  await eachLine(OA+"runways.csv",l=>{
    if(!R){ const H=parseCSV(l)[0]||[], jx=k=>H.indexOf(k); R={ad:jx("airport_ident"),cl:jx("closed"),le:jx("le_ident"),he:jx("he_ident"),hd:jx("le_heading_degT"),len:jx("length_ft")}; re=quick(R.ad,"runways.csv"); return; }
    const m=re.exec(l); if(!m||!st[m[1]]) return;
    const r=parseCSV(l)[0]; if(!r||r[R.ad]!==m[1]||r[R.cl]==="1") return;
    const le=r[R.le], he=r[R.he]; if(!le||!he||/^H/.test(le)) return;
    let h=parseFloat(r[R.hd]); if(isNaN(h)){ const n=parseInt(le,10); h=isNaN(n)?null:n*10; }
    if(h!=null) st[m[1]][4].push([le,he,Math.round(h),+r[R.len]||0]);
  });
  ST=st; try{ localStorage.setItem("rb2st",JSON.stringify({v:1,at:Date.now(),st})); }catch(e){}
  status(`${Object.keys(st).length} stations METAR chargées`);
}
function fltCat(m){
  if(!m) return "UNK"; let vis=null, ceil=null;

  const v=m.match(/\s(\d{4})(?:NDV)?(?=\s)/); if(vis==null&&v) vis=+v[1];
  const sm=m.match(/\s(?:(\d+)\s)?(\d+)(?:\/(\d+))?SM\s/); if(vis==null&&sm){ let x=sm[3]?+sm[2]/+sm[3]:+sm[2]; if(sm[1]) x+=+sm[1]; vis=x*1609; }
  for(const c of m.matchAll(/\s(BKN|OVC|VV)(\d{3})/g)){ const h=+c[2]*100; if(ceil==null||h<ceil) ceil=h; }
  if(vis==null&&ceil==null) return "UNK";
  vis=vis??10000; ceil=ceil??1e6;
  if(ceil<500||vis<1600) return "LIFR"; if(ceil<1000||vis<5000) return "IFR"; if(ceil<=3000||vis<=8000) return "MVFR"; return "VFR";
}

  if(panel){ $("dTitle").textContent=TITLES[panel]; $("dBody").scrollTop=0; /* chaque panneau s'ouvre en haut */ if(panel==="search") setTimeout(()=>$("q").focus(),50); if(panel==="maps") renderMaps(); if(panel==="settings") renderSettings(); if(panel==="favs") renderFavs();

  document.body.classList.toggle("drawer-open",!!panel);
  setTimeout(()=>{map.invalidateSize();sizeCanvas();renderAll();},60);
}

// Réglages → Diagnostic : plantages détectés, 5 derniers incidents, appareil, et le journal complet à copier pour Claude
function iosVer(){ const m=navigator.userAgent.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))? like Mac OS X/); return m?`iOS ${m[1]}.${m[2]}${m[3]?"."+m[3]:""}`:null; }
function devInfo(){
  let inst=false; try{ inst=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches; }catch(e){}
  const os=iosVer()||(/Android [\d.]+/.exec(navigator.userAgent)?.[0])||navigator.platform||"ordinateur";
  return `${os} · écran ${screen.width}×${screen.height} · densité ${+(devicePixelRatio||1).toFixed(2)} · fenêtre ${innerWidth}×${innerHeight}${inst?" · appli installée":""}`;
}
const fmtJ=t=>new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function diagHtml(){
  const L=jread("rb3log")||[], c=jread("rb3crash"), n=c?.n||0;
  return `<div class="note">Tropo <b style="color:var(--fg)">v${VERSION}</b> · plantages détectés : <b style="color:${n?"var(--warn)":"var(--fg)"}">${n}</b>${n?` depuis le ${fmtJ(c.since)}`:""}<br>${esc(devInfo())}</div>
   <div class="diag">${L.length?L.slice(-5).reverse().map(x=>`<span class="e"><b>${fmtJ(x.t)}</b> · ${esc(x.ty)} · ${esc(x.m)}</span>`).join(""):"Aucun incident enregistré sur cet appareil."}</div>
   <div class="btns"><button class="linkbtn" id="diagCopy">Copier le journal</button><button class="linkbtn" id="diagClear">Effacer</button></div>
   <textarea id="diagTxt" readonly hidden aria-label="Journal technique à copier"></textarea>
   <div class="note">Si Tropo plante ou se recharge tout seul : « Copier le journal », puis colle le texte à Claude.</div>`;
}

function profileSvg(prof){
  if(prof.length<2) return '<div class="note">Profil indisponible.</div>';
  const W=320,Hh=230,m={l:44,r:12,t:10,b:24};
  const tmin=Math.floor(Math.min(...prof.map(r=>r.td??r.t))/10)*10-5, tmax=Math.ceil(Math.max(...prof.map(r=>r.t))/10)*10+5;
  const zmax=Math.min(42000,Math.ceil(Math.max(...prof.map(r=>r.z))/5000)*5000);
  const X=t=>m.l+(t-tmin)/(tmax-tmin)*(W-m.l-m.r), Y=z=>Hh-m.b-z/zmax*(Hh-m.t-m.b);
  let s=`<svg id="profile" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Profil de température et point de rosée">`;
  for(let z=0;z<=zmax;z+=10000) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(z)}" y2="${Y(z)}" style="stroke:var(--line)"/><text x="${m.l-4}" y="${Y(z)+3}" style="fill:var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono,monospace">FL${String(z/100).padStart(3,"0")}</text>`;
  for(let t=Math.ceil(tmin/10)*10;t<=tmax;t+=10) s+=`<text x="${X(t)}" y="${Hh-8}" style="fill:var(--muted)" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">${t}°</text>`;
  if(S.alt) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(S.alt)}" y2="${Y(S.alt)}" stroke="#3b8cf5" stroke-dasharray="2 3"/><text x="${m.l+3}" y="${Y(S.alt)-3}" fill="#3b8cf5" font-size="9" font-family="JetBrains Mono,monospace">${altName(S.alt)}</text>`;
  for(let k=0;k<prof.length-1;k++){ const a=prof[k],b=prof[k+1]; if(a.rh>=90&&b.rh>=90) s+=`<rect x="${m.l}" width="${W-m.l-m.r}" y="${Y(b.z)}" height="${Y(a.z)-Y(b.z)}" style="fill:var(--fg)" fill-opacity=".08"/>`; }
  if(tmin<0&&tmax>0) s+=`<line x1="${X(0)}" x2="${X(0)}" y1="${m.t}" y2="${Hh-m.b}" stroke="#67e8f9" stroke-dasharray="3 3" stroke-opacity=".7"/>`;
  const path=k=>prof.filter(r=>r[k]!=null).map((r,j)=>`${j?"L":"M"}${X(r[k]).toFixed(1)},${Y(r.z).toFixed(1)}`).join("");
  s+=`<path d="${path("td")}" fill="none" stroke="#3b8cf5" stroke-width="2"/><path d="${path("t")}" fill="none" stroke="#ef4444" stroke-width="2"/>`;
  for(const r of prof) if(r.t<=0&&r.t>=-15&&r.rh>=80) s+=`<circle cx="${W-m.r-4}" cy="${Y(r.z)}" r="3" fill="#67e8f9"/>`;
  s+=`<text x="${W-m.r}" y="${m.t+8}" fill="#ef4444" font-size="9.5" text-anchor="end" font-family="Inter,sans-serif">Température</text><text x="${W-m.r}" y="${m.t+20}" fill="#3b8cf5" font-size="9.5" text-anchor="end" font-family="Inter,sans-serif">Point de rosée</text>`;
  return s+"</svg>";
}

async function metno(lat,lon,tz){

const WX={};
const keyOf=(lat,lon)=>lat.toFixed(2)+","+lon.toFixed(2);
async function loadWx(locs){
  const out=await Promise.all(locs.map(l=>metno(l.lat,l.lon,l.tz).catch(()=>null)));
  if(out.every(Boolean)) return out;
  const om=omBlocked()?[]:await loadWxOM(locs.filter((l,i)=>!out[i]));
  let k=0; return out.map(d=>d||om[k++]||null);

async function loadWxOM(locs){
  if(!locs.length) return [];
  const now=Date.now(), miss=locs.filter(l=>{const w=WX[keyOf(l.lat,l.lon)]; return !w||now-w.at>10*60e3;});
  if(miss.length){
    try{
      usage(miss.length*2);   // une vingtaine de variables par lieu : compte pour environ deux requêtes
      // horaire sur 26 h (widgets heure par heure et baromètre) et 10 jours (widget 10 jours)
      const ask=uv=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${miss.map(l=>l.lat.toFixed(3)).join(",")}&longitude=${miss.map(l=>l.lon.toFixed(3)).join(",")}`+
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cloud_cover${uv?",uv_index":""}`+
        `&hourly=temperature_2m,precipitation,pressure_msl&forecast_hours=26`+
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset${uv?",uv_index_max":""}&forecast_days=10&timezone=auto&timeformat=unixtime&wind_speed_unit=kn`).then(r=>r.json());
      let j=await ask(true);
      if(j?.error&&!/limit/i.test(j.reason||"")) j=await ask(false);   // repli si une variable est refusée
      if(j?.error){ if(/limit/i.test(j.reason||"")) omHitLimit(j.reason); throw new Error(j.reason); } if(!Array.isArray(j)) j=[j];
      j.forEach((d,i)=>{ WX[keyOf(miss[i].lat,miss[i].lon)]={at:now,d}; });
    }catch(e){ status("Météo des lieux indisponible : "+e.message); }
  }
  return locs.map(l=>WX[keyOf(l.lat,l.lon)]?.d||null);
}

// pluie au quart d'heure des 2 prochaines heures : valeurs, heures et phrase (« Pluie à partir de 15:45 »)
function rain2(M){
  const now=Date.now()/1000, ix=[]; for(let i=0;i<M.time.length;i++) if(M.time[i]>now-900&&M.time[i]<=now+2*3600) ix.push(i);
  const v=ix.map(i=>M.precipitation?.[i]??0), t=ix.map(i=>M.time[i]), wet=v.map(x=>x>=.1), tot=v.reduce((a,b)=>a+b,0);
  const txt=off=>{ if(!wet.some(Boolean)) return "Pas de pluie prévue dans les 2 h";
    if(wet[0]){ const e=wet.indexOf(false); return e<0?"Pluie pendant les 2 prochaines heures":`Pluie en cours, fin vers <b>${hm(t[e],off)}</b>`; }
    return `Pluie à partir de <b>${hm(t[wet.indexOf(true)],off)}</b>`; };
  return {v,t,wet,tot,txt};
}
// orages : CAPE, codes « orage » et potentiel de foudre des 12 prochaines heures (fiche Point si elle est ouverte, sinon la requête « maintenant »)
function stormInfo(R){
  let H=null, X=null;
  if(R?.d?.source==="om"&&R.d.hourly?.cape){ H=R.d.hourly; X=R.d.exh; } else if(R?.now?.hourly?.cape){ H=R.now.hourly; X=H; }
  if(!H?.time) return null;
  const now=Date.now()/1000, ix=[]; for(let i=0;i<H.time.length;i++) if(H.time[i]>=now-1800&&H.time[i]<=now+12*3600) ix.push(i);
  if(!ix.length) return null;
  const cape=ix.map(i=>H.cape?.[i]??0), codes=ix.map(i=>H.weather_code?.[i]??null), cmax=Math.max(0,...cape), th=codes.findIndex(c=>c>=95);
  const lp=X?.lightning_potential?ix.map(i=>X.lightning_potential[X===H?i:hIndex(X.time,H.time[i])]).filter(v=>v!=null):[];
  return {cape,cmax,tmax:H.time[ix[cape.indexOf(cmax)]],th:th>=0?H.time[ix[th]]:null,lmax:lp.length?Math.max(...lp):null,lvl:th>=0||cmax>=1500?3:cmax>=500?2:cmax>=150?1:0};
}

/* Glisser-déposer avec les événements de pointeur (souris, doigt, stylet), sans bibliothèque : le widget suit le pointeur,
   les autres s'écartent, l'ordre est enregistré au lâcher. Axe "y" : colonne (ordinateur) ; "x" : pastilles (téléphone). */
function bindDrag(el,axis){
  const Y=axis==="y", pos=e=>Y?e.clientY:e.clientX, start=r=>Y?r.top:r.left, len=r=>Y?r.height:r.width, sc=Y?"scrollTop":"scrollLeft";
  el.querySelectorAll(".wi").forEach(it=>{
    it.onpointerdown=e=>{
      if((e.button||0)>0||e.target.closest(".wx")) return;
      e.preventDefault();
      const id=e.pointerId, p0=pos(e); let on=false, grab=0, shift=0;
      try{ it.setPointerCapture(id); }catch(_){}
      const move=ev=>{
        if(ev.pointerId!==id) return;
        const p=pos(ev);
        if(!on){ if(Math.abs(p-p0)<5) return; on=wDrag=true; it.classList.add("drag"); grab=p0-start(it.getBoundingClientRect()); }
        const box=el.getBoundingClientRect();   // défilement automatique près des bords
        if(p<start(box)+30) el[sc]-=10; else if(p>start(box)+len(box)-30) el[sc]+=10;
        const others=[...el.querySelectorAll(".wi")].filter(x=>x!==it);
        const before=others.find(x=>{ const r=x.getBoundingClientRect(); return p<start(r)+len(r)/2; })||null;
        const nxt=it.nextElementSibling?.classList.contains("wi")?it.nextElementSibling:null;
        if(before!==nxt){ if(before) el.insertBefore(it,before); else if(others.length) others[others.length-1].after(it); }
        const base=start(it.getBoundingClientRect())-shift;   // place réelle, sans le décalage en cours
        shift=p-grab-base; it.style.transform=`translate${Y?"Y":"X"}(${shift.toFixed(1)}px)`;
      };
      const up=ev=>{
        if(ev.pointerId!==id) return;
        removeEventListener("pointermove",move); removeEventListener("pointerup",up); removeEventListener("pointercancel",up);
        it.classList.remove("drag"); it.style.transform="";
        if(!on) return;
        wDrag=false; wPend=false;
        const order=[...el.querySelectorAll(".wi")].map(x=>x.dataset.w).filter(k=>k in WIDGETS);
        if(order.length===S.widgets.length) S.widgets=order;
        wChanged();
      };
      addEventListener("pointermove",move); addEventListener("pointerup",up); addEventListener("pointercancel",up);
    };
  });
}
// appui long (0,55 s) sur un widget ou une pastille : passe en mode modification
function bindLongPress(node){
  let t=0, x=0, y=0; const stop=()=>{ clearTimeout(t); t=0; };
  node.addEventListener("pointerdown",e=>{ if((e.button||0)>0) return; x=e.clientX; y=e.clientY; stop(); t=setTimeout(()=>{ t=0; lpAt=Date.now(); setWEdit(true); },550); });
  node.addEventListener("pointermove",e=>{ if(t&&Math.hypot(e.clientX-x,e.clientY-y)>8) stop(); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>node.addEventListener(ev,stop));
  node.addEventListener("contextmenu",e=>e.preventDefault());   // pas de menu « copier » pendant l'appui long
}

// ---------- Qualité de l'air des widgets ----------
// celle de la fiche Point quand elle est ouverte (rangée ici par openPoint), sinon l'API d'Open-Meteo : une requête par lieu, gardée 1 h
const AQ={}, aqBusy=new Set(), AQ_PAUSE="En pause : la limite gratuite d'Open-Meteo est atteinte.";
async function loadAir(){
  if(!REF||!(S.widgets.includes("air")||panel==="widgets")) return;
  const r=REF, k=keyOf(r.lat,r.lon), c=AQ[k];
  if(c&&Date.now()-c.at<3600e3){ if(r.aq!==c.d){ r.aq=c.d; r.aqErr=null; airDone(); } return; }
  if(aqBusy.has(k)) return;
  if(omBlocked()){ if(r.aqErr!==AQ_PAUSE){ r.aqErr=AQ_PAUSE; airDone(); } return; }
  aqBusy.add(k); let err=null;
  try{
    usage(2);
    const j=await (await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${r.lat.toFixed(4)}&longitude=${r.lon.toFixed(4)}&current=european_aqi,pm10,pm2_5,ozone,nitrogen_dioxide,dust,${POLL.map(x=>x[0]).join(",")}&timezone=auto`)).json();
    if(j?.error){ if(/limit/i.test(j.reason||"")) omHitLimit(j.reason); throw new Error(j.reason||"réponse invalide"); }
    AQ[k]={at:Date.now(),d:j.current||{}};
  }catch(e){ err=omBlocked()?AQ_PAUSE:"Qualité de l'air indisponible pour le moment."; if(!/limit/i.test(e.message)) jlog("données","qualité de l'air indisponible : "+e.message,30*60e3); }
  finally{ aqBusy.delete(k); }
  if(REF&&keyOf(REF.lat,REF.lon)===k){ if(AQ[k]){ REF.aq=AQ[k].d; REF.aqErr=null; } else REF.aqErr=err; airDone(); }
}
function airDone(){ renderWidgets(); if(panel==="widgets") renderWidgetLib(); }
// ---------- Pluie au quart d'heure et orages (v7.0.2) ----------
/* Une requête Open-Meteo par lieu (pluie par quart d'heure sur 2 h, CAPE, codes temps et foudre sur 12 h), gardée 15 min.
   Seulement si un des widgets « Pluie à 2 h » ou « Orages » est sur la carte, si la bibliothèque est ouverte, ou pour les alertes. */
const NOWC={}, nowBusy=new Set();
const nowNeeded=()=>S.widgets.includes("rain2h")||S.widgets.includes("storm")||panel==="widgets";
async function fetchNow(loc){
  const k=keyOf(loc.lat,loc.lon), c=NOWC[k];
  if(c&&Date.now()-c.at<15*60e3) return c.d;
  if(omBlocked()||nowBusy.has(k)) return c?.d||null;
  nowBusy.add(k);
  try{
    const ask=lp=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat.toFixed(4)}&longitude=${loc.lon.toFixed(4)}&minutely_15=precipitation&forecast_minutely_15=9&hourly=cape,weather_code,precipitation_probability${lp?",lightning_potential":""}&forecast_hours=13&timeformat=unixtime&timezone=auto`).then(r=>r.json());
    usage(1);
    let j=await ask(true);
    if(j?.error&&!/limit/i.test(j.reason||"")) j=await ask(false);   // foudre refusée hors d'Europe centrale : sans elle
    if(j?.error){ if(/limit/i.test(j.reason||"")) omHitLimit(j.reason); throw new Error(j.reason||"réponse invalide"); }
    NOWC[k]={at:Date.now(),d:j}; return j;
  }catch(e){ if(!/limit/i.test(e.message)) jlog("données","pluie au quart d'heure indisponible : "+e.message,30*60e3); return c?.d||null; }
  finally{ nowBusy.delete(k); }
}
async function loadNow(){
  if(!REF||!nowNeeded()) return;
  const r=REF, k=keyOf(r.lat,r.lon), c=NOWC[k];
  if(c&&Date.now()-c.at<15*60e3){ if(r.now!==c.d){ r.now=c.d; r.nowErr=null; airDone(); } return; }
  if(omBlocked()){ if(r.nowErr!==AQ_PAUSE){ r.nowErr=AQ_PAUSE; airDone(); } return; }
  const d=await fetchNow(r);
  if(REF&&keyOf(REF.lat,REF.lon)===k){ if(d){ REF.now=d; REF.nowErr=null; } else REF.nowErr=omBlocked()?AQ_PAUSE:"Indisponible pour le moment."; airDone(); }
}

function wxStore(){ try{ return JSON.parse(localStorage.getItem("rb3wx")||"{}")||{}; }catch(e){ return {}; } }
function wxSave(loc,d){

  Object.keys(all).sort((a,b)=>all[b].at-all[a].at).slice(8).forEach(x=>delete all[x]);

}

function xwBest(icao,wd,ws,gu){

function cmpChart(R,key,label,cv,opt={}){
  const t0=Math.floor(Date.now()/3600e3)*3600, t1=t0+72*3600, W=330, Hh=100, m={l:34,r:6,t:8,b:16}, X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r);
  const ser=(k,i,r)=>{ const H=r.d?.hourly, pts=[]; if(!H?.time||!H[k]) return pts;
    for(let j=0;j<H.time.length;j++){ const t=H.time[j], v=H[k][j]; if(t<t0-1800||t>t1+1800||v==null) continue; pts.push([t,cv(v)]); } return pts; };
  const S1=R.map((r,i)=>({i,p:ser(key,i,r),q:opt.extra?ser(opt.extra,i,r):[]})).filter(s=>s.p.length>1);
  if(!S1.length) return "";
  const all=S1.flatMap(s=>[...s.p,...s.q].map(p=>p[1])); let lo=Math.min(...all), hi=Math.max(...all);
  if(opt.zero) lo=Math.min(0,lo); if(opt.top!=null) hi=Math.max(hi,opt.top); if(hi-lo<1e-6) hi=lo+1;
  const Y=v=>m.t+(hi-v)/(hi-lo)*(Hh-m.t-m.b), dg=Math.abs(hi-lo)<3?1:0;
  let g="";
  for(const v of [lo,(lo+hi)/2,hi]) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line)" stroke-width=".6"/><text x="${m.l-4}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v.toFixed(dg)}</text>`;
  for(let t=Math.ceil(t0/43200)*43200;t<=t1;t+=43200){ const dd=new Date(t*1000); g+=`<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="${m.t}" y2="${Hh-m.b}" style="stroke:var(--line)" stroke-width=".6"/><text x="${X(t).toFixed(1)}" y="${Hh-4}" text-anchor="middle">${dd.getUTCHours()?"12Z":dayFr[dd.getUTCDay()]}</text>`; }
  const tc=curT(); if(tc>=t0&&tc<=t1) g+=`<line x1="${X(tc).toFixed(1)}" x2="${X(tc).toFixed(1)}" y1="${m.t}" y2="${Hh-m.b}" style="stroke:var(--fg)" stroke-dasharray="2 3" stroke-width=".9"/>`;
  const path=p=>p.map(([t,v],j)=>`${j?"L":"M"}${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  for(const s of S1){ g+=`<path d="${path(s.p)}" fill="none" stroke="${CMPC[s.i]}" stroke-width="1.8" stroke-linejoin="round"/>`; if(s.q.length>1) g+=`<path d="${path(s.q)}" fill="none" stroke="${CMPC[s.i]}" stroke-width="1.2" stroke-dasharray="3 3"/>`; }
  return `<div class="cmpch"><div class="k">${label}</div><svg class="wsvg" viewBox="0 0 ${W} ${Hh}" aria-hidden="true">${g}</svg></div>`;
}
// recherche commune (panneau Recherche, comparateur, palette) : aérodromes de la base, puis géocodage d'Open-Meteo (avec le fuseau du lieu)
async function placeSearch(q){
  const out=[], Q=q.toUpperCase();
  for(const [ic,name,lat,lon] of FAVS) if(ic.startsWith(Q)||norm(name).includes(norm(q))) out.push({t:ic,s:name,lat,lon,icao:ic,tz:"Europe/Paris"});
  if(ST) for(const [id,s] of Object.entries(ST)){ if(out.length>=8) break; if(out.some(o=>o.icao===id)) continue;
    if(id.startsWith(Q)||(Q.length>=3&&norm(s[3]).includes(norm(q)))) out.push({t:id,s:s[3],lat:s[0],lon:s[1],icao:id,tz:/^LF/.test(id)?"Europe/Paris":null}); }
  try{ const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=fr`)).json();
    for(const x of g.results||[]) out.push({t:x.name,s:[x.admin1,x.country].filter(Boolean).join(", "),lat:x.latitude,lon:x.longitude,tz:x.timezone||null}); }catch(e){}
  return out;
}

function palAlt(q){ const s=q.trim().toLowerCase(); let a=null, m;
  if(/^(sfc|sol)$/.test(s)) a=0; else if((m=s.match(/^fl\s*(\d{2,3})$/))) a=+m[1]*100; else if((m=s.match(/^(\d{3,5})\s*(ft|pieds)?$/))) a=+m[1];

function palScore(it,toks){ const h=norm(it.t+" "+(it.kw||"")+" "+(it.s||"")), words=h.split(/[^a-z0-9]+/); let sc=0;
  for(const k of toks){ if(words.some(w=>w.startsWith(k))) sc+=2; else if(h.includes(k)) sc+=1; else return 0; }
  return sc+(norm(it.t).startsWith(toks[0])?1:0); }
function palPlaces(q){
  const out=[], Q=q.toUpperCase().trim(), nq=norm(q.trim()); if(nq.length<2) return out;
  for(const f of S.favs) if(norm(f.name).includes(nq)||(f.icao&&f.icao.startsWith(Q))) out.push({id:"fav:"+f.lat+","+f.lon,t:f.name,s:"favori"+(f.icao?" · "+f.icao:""),icon:"plane",run:()=>{ map.setView([f.lat,f.lon],Math.max(map.getZoom(),9)); openPoint(f.lat,f.lon,{icao:f.icao,name:f.name,tz:f.tz}); }});
  for(const [ic,name] of FAVS) if(ic.startsWith(Q)||norm(name).includes(nq)) out.push({id:"ad:"+ic,t:`${ic} · ${name}`,s:"aérodrome",icon:"plane",run:()=>goAd(ic)});
  if(ST) for(const [id,s] of Object.entries(ST)){ if(out.length>=10) break; if(out.some(o=>o.id==="ad:"+id)) continue;
    if(id.startsWith(Q)||(nq.length>=3&&norm(s[3]).includes(nq))) out.push({id:"ad:"+id,t:`${id} · ${shortName(s[3])}`,s:"aérodrome",icon:"plane",run:()=>{ map.setView([s[0],s[1]],Math.max(map.getZoom(),9)); openPoint(s[0],s[1],{icao:id,tz:/^LF/.test(id)?"Europe/Paris":null}); }}); }

function palFilter(q,geo=[]){

setInterval(()=>{ loadNow(); },15*60e3);   /* pluie au quart d'heure et orages : seulement si un widget en a besoin (nowNeeded) */
// alertes de Tropo : 20 s après l'ouverture, puis toutes les 10 min (seulement si elles sont activées)
if(S.alerts.on) swReady();
setTimeout(checkAlerts,20e3); setInterval(checkAlerts,10*60e3);
setInterval(loadRadar,5*60e3); setInterval(()=>{ if(GA) GA.at=0; if(GM) GM.at=0; refreshGrids(); },60*60e3); setInterval(initMetars,10*60e3);
